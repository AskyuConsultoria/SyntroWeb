<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syntro Web - Departamentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/sidebar.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="./assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="./styles/upload.css">
  <script src="sidebar.js"></script>
</head>
<style>
  a {
    text-decoration: none;
  }

  .purple {
    color: #7C2DB9;

  }

  .outline-purple {
    outline-color: #7C2DB9;
    outline-style: solid;
  }

  .bold {
    font-weight: bold;
  }

  .cinza {
    color: #545F71
  }
</style>

<body style="background-color: #F1F5F8;">
  <div  style="width:50%;height:100%; position:fixed;left:50%;display:block;background-color: #F1F5F8;z-index:100">
    <button>x</button>
    <div class="d-flex flex-column " style="padding: 5% 10%;  width:100%;height:100%;">
      <h3>Adicione um novo membro</h3>
      <div class="d-flex flex-column " style=" width:100%;margin-top:10%">
        <span class="mb-3">Email do Representante*</span>
        <input class="p-2" type="text" placeholder="Insira o email do representante">
      </div>
      <div class="d-flex flex-column" style=" width:100%;margin-top:10%">
        <span class="mb-3">Access level *</span>
        <select name="" id class="p-2">
          <option value="#">Selecione</option>
        </select>
      </div>
      <div class="d-flex justify-content-between w-100 mt-5">
        <button class="cancel" style="background-color: #FFFFFF;border-color: #7C2DB9; border-radius: 16px; padding:3% 5%;">Cancelar</button>
        <button class="save  rounded" style="background-color: #7C2DB9;color: #FFFFFF;font-weight:bold; padding:3% 5%;border:none;">Salvar</button>
      </div>
      
      
    </div>

  </div>
  <div class="d-flex flex-row justify-content-between">
    <div>
      <side-bar></side-bar>
    </div>
    <div class="all-content">
      <div class="nav-content">
        <div class="bnts" style="display: flex; width: 110px; justify-content: space-evenly;">
          <img src="./assets/arrow-square-right.svg" style="transform: rotate(180deg);">
          <img src="./assets/arrow-square-right.svg">
        </div>
        <div class="d-flex flex-row align-items-center acesso">
          <span style="color: #5e5959;">Meu acesso | Cadastros | Departamentos </span>
          <div style="gap: 10px;">
            <div class="d-flex align-items-center gap-2">
              <div class="fornecedor-icon icon-btn d-flex align-items-center justify-content-evenly"
                style="cursor: pointer">
                <img src="assets/bell.svg" style="height: 20px;">
              </div>
              <div>
                <img src="./assets/Component 1.svg" style="height: 30px;">
                <span>Fornecedor</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="add-text-icon">
          <span class="me-2">Departamento de Agilidade</span>
          <img src="./assets/paperclip-2.svg" style="height: 20px;">
        </div>
        <hr style="width: 95%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
        <div>
          <div style="width: 95%; padding-top: 2%;">
            <div class="d-flex">
              <div class=" rounded-3 me-5 w-50 d-flex align-item-center justify-content-around"
                style="background-color: #FFFFFF;box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
                <img src="./assets/bloom-search.svg" style="width: 5%;color:#7C2DB9" class="ms-3">
                <input type="text" class="form-control rounded border border-0" placeholder="Busque pelo membro">
              </div>
              <div class="border purple outline-purple align-items-center d-flex justify-content-between"
                style="border-radius: 6px;padding:1% 3%;" onclick="addMember()">
                <img src="./assets/add-square.svg">
                <span class="purple bold ms-3">Adicionar novo membro</span>
              </div>

            </div>
            <div class="table mt-4" style="display:flex; flex-direction: column; ">
              <div class="table_header mx-2" style="display:flex; justify-content: space-between;">
                <b class="cinza">Nome</b>
                <b class="cinza">Data de Entrada</b>
                <b class="cinza">Acesso Level</b>
                <b class="cinza">Serviços Ativos</b>
              </div>
              <div class="list_information">
                <div class="list mt-4">
                  <div class="item rounded shadow-s  "
                    style="display:flex ; justify-content: space-between; align-content:space-between; padding:1%">
                    <span class="cinza">Thamires Fernandes</span>
                    <span class="cinza" style="position:fixed;left:39.7%">09/10/2025</span>
                    <span class="cinza" style="position:fixed; left: 63.1%;">Adm. Interno</span>
                    <span class="cinza" style="position:fixed;left: 85.3%">2</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  </div>


</body>

</html>
