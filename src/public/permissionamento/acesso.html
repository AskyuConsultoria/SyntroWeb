<script>
  const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
  const nomeHeader = document.getElementById('nomeUsuarioHeader');
  nomeHeader.innerHTML = usuarioLogado.nomeUsuario;

  const tags = document.querySelectorAll('.tags span')

  const sidebarElement = document.querySelector('side-bar');

  function cadastrar() {
    window.location.href = "/cadastros/permissionamento";
  }

  sidebarElement.addEventListener('toggle-sidebar', () => {
    document.body.classList.toggle('sidebar-collapsed');
  });

  const dados = [
    { nome: "ADM", qtdMembros: 1, descricao: "Acesso total ao sistema, incluindo gerenciamento de usuários e permissões." },
    { nome: "Auditor", qtdMembros: 2, descricao: "Pode gerenciar aprovar e negar notas." },
    { nome: "Emissor", qtdMembros: 2, descricao: "Acesso somente a visualização de notas da sua empresa e envio de notas." },
  ];

  function renderTabela(filtro = '') {
    const tbody = document.getElementById('permissaoTableBody');
    tbody.innerHTML = '';

    const filtrados = dados.filter(item =>
      item.nome.toLowerCase().includes(filtro.toLowerCase())
    );

     tags.forEach(tag => {
                if (tag.classList.contains("active")) {
                    tag.textContent = `${tag.dataset.status} (${filtrados.length})`;
                } else {
                    tag.textContent = tag.dataset.status;
                }
            });

    filtrados.forEach(item => {
      const tr = document.createElement('tr');

      const tdNome = document.createElement('td');
      tdNome.textContent = item.nome;
      tr.appendChild(tdNome);

      const tdQtd = document.createElement('td');
      tdQtd.textContent = item.qtdMembros;
      tr.appendChild(tdQtd);

      const tdDesc = document.createElement('td');
      tdDesc.textContent = item.descricao;
      tr.appendChild(tdDesc);

      tbody.appendChild(tr);
    });
  }

  // Inicializa tabela ao carregar a página
  document.addEventListener('DOMContentLoaded', () => {
    renderTabela();

    // Adiciona evento de busca
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
      renderTabela(searchInput.value);
    });
  });
</script>
