<script>
const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
const nomeHeader = document.getElementById('nomeUsuarioHeader');
nomeHeader.innerHTML = usuarioLogado.nomeUsuario;
const identificadorNf = window.sessionStorage.getItem("id");
const sessaoIdNf = document.getElementById("id_nf");
sessaoIdNf.innerHTML = `${identificadorNf || "Nota não identificada"}`;

// Botão Seguir NF
const btnSeguir = document.getElementById("addNotaBtn");
const seguirKey = `seguir_${identificadorNf}`;
let estaSeguindo = sessionStorage.getItem(seguirKey) === "true";

function atualizarBotaoSeguir() {
    if (estaSeguindo) {
        btnSeguir.innerHTML = `<i class="bi bi-check-lg"></i> Seguindo`;
        btnSeguir.classList.remove("btn-primary");
        btnSeguir.classList.add("btn-success");
    } else {
        btnSeguir.innerHTML = `<i class="bi bi-plus-lg"></i> Seguir NF`;
        btnSeguir.classList.remove("btn-success");
        btnSeguir.classList.add("btn-primary");
    }
}

btnSeguir.addEventListener("click", () => {
    estaSeguindo = !estaSeguindo;
    sessionStorage.setItem(seguirKey, estaSeguindo);
    atualizarBotaoSeguir();
});

const inputEntrada = document.getElementById("entrada");
const inputVencimento = document.getElementById("vencimento");
const inputEmissao = document.getElementById("emissao");
const inputCobranca = document.getElementById("cobranca");
const inputDescricao = document.getElementById("descricao");

async function carregarNota() {
    try {
        const url = `http://localhost:8080/syntro/nota-fiscal/${identificadorNf}`;
        const response = await fetch(url, { method: "GET", headers: { "Content-Type": "application/json" }});
        if (!response.ok) throw new Error(`Erro na requisição: ${response.status}`);
        const nota = await response.json();

        let nomeUsuario = "Não Informado";
        if (nota.idUsuario) {
            try {
                const userResponse = await fetch(`http://localhost:8080/syntro/user/${nota.idUsuario}`);
                if (userResponse.ok) {
                    const userData = await userResponse.json();
                    nomeUsuario = userData.nomeUsuario || nomeUsuario;
                }
            } catch (err) {
                console.warn(`Erro ao buscar usuário ${nota.idUsuario}:`, err);
            }
        }

        return {
            servico: nota.descricao || "Não informado",
            numero: nota.numeroIdentificador || "Sem número",
            valor: nota.valorTotal ?? 0,
            moeda: nota.nomeMoeda || "R$",
            vencimento: nota.dataVencimento ? new Date(nota.dataVencimento) : null,
            emissao: nota.dataEmissao ? new Date(nota.dataEmissao) : null,
            emissor: nomeUsuario,
            contrato: nota.idContrato,
            empresa: nota.idEmpresa,
            status: nota.status || "em-validacao"
        };
    } catch (error) {
        console.error("Erro ao buscar nota fiscal:", error);
        return null;
    }
}

async function definirInputs() {
    const nota = await carregarNota();
    if (!nota) return;

    if (nota.vencimento) inputVencimento.value = nota.vencimento.toISOString().split("T")[0];
    if (nota.emissao) {
        const pad = n => n.toString().padStart(2, "0");
        inputEmissao.value = `${nota.emissao.getFullYear()}-${pad(nota.emissao.getMonth()+1)}-${pad(nota.emissao.getDate())}T${pad(nota.emissao.getHours())}:${pad(nota.emissao.getMinutes())}`;
    }

    inputCobranca.value = `R$ ${Number(nota.valor).toFixed(2).replace('.', ',')}`;
    inputDescricao.value = nota.servico;

    if (nota.status) currentStatus = nota.status;
    const defaultStatus = statusList.find(s => s.value === currentStatus);
    if (defaultStatus) selected.innerHTML = `<span class="status-dot" style="background:${defaultStatus.color}"></span> ${defaultStatus.label}`;
    renderDropdownOptions();
    await renderizarInfoContrato(nota.contrato, nota.empresa, nota.emissor);
}

const dropdown = document.getElementById('statusDropdown');
const selected = dropdown.querySelector('.status-selected span');
const optionsContainer = dropdown.querySelector('.status-options');

const statusList = [
    { value: "em-andamento", label: "Em andamento", color: "#007bff"}, 
    { value: "em-validacao", label: "Em validação", color: "#ffc107"},  
    { value: "aprovadas", label: "Aprovada", color: "#28a745"},        
    { value: "congeladas", label: "Congelada", color: "#6c757d"},      
    { value: "reprovadas", label: "Reprovada", color: "#dc3545"} 
];

let currentStatus = "em-validacao";

function renderDropdownOptions() {
    optionsContainer.innerHTML = "";
    statusList.filter(s => s.value !== currentStatus).forEach(s => {
        const div = document.createElement("div");
        div.dataset.value = s.value;
        div.innerHTML = `<span class="status-dot" style="background:${s.color}"></span> ${s.label}`;
        optionsContainer.appendChild(div);

        div.addEventListener("click", () => {
            currentStatus = s.value;
            selected.innerHTML = `<span class="status-dot" style="background:${s.color}"></span> ${s.label}`;
            optionsContainer.style.display = "none";
            renderDropdownOptions();
            sessionStorage.setItem(`status_${identificadorNf}`, currentStatus);

        });
    });
}

dropdown.querySelector('.status-selected').addEventListener('click', () => {
    optionsContainer.style.display = optionsContainer.style.display === 'flex' ? 'none' : 'flex';
    optionsContainer.style.flexDirection = 'column';
});

document.addEventListener('click', e => {
    if (!dropdown.contains(e.target)) optionsContainer.style.display = 'none';
});

async function renderizarInfoContrato(idContrato, idEmpresa, emissor) {

    let contrato = null;
    let empresa = null;

    if (idContrato) {
        try {
            const contratoResp = await fetch(`http://localhost:8080/syntro/contrato/${idContrato}`);
            if (!contratoResp.ok) throw new Error("Contrato não encontrado");
            contrato = await contratoResp.json();
        } catch (e) {
            console.warn("Falha ao buscar contrato, tentando empresa...", e);
        }
    }

    if (idEmpresa) {
        try {
            const empresaResp = await fetch(`http://localhost:8080/syntro/empresas/${idEmpresa}`);
            if (!empresaResp.ok) throw new Error("Empresa não encontrada");
            empresa = await empresaResp.json();
        } catch (e) {
            console.warn("Falha ao buscar empresa.", e);
        }
    }

    if (!contrato && !empresa) {
        console.warn("Nem contrato nem empresa foram encontrados.");
        return;
    }

    let representanteNome = "Desconhecido";
    const representanteStr = sessionStorage.getItem("usuarioLogado");
    // if (representanteStr) {
    //     const representanteObj = JSON.parse(representanteStr);
    //     representanteNome = representanteObj.nomeUsuario || representanteNome;
    // }

    if (contrato) {
        document.querySelector('input[placeholder="Nome serviço"]').value =
            contrato.nomeServico || "Não informado";

        // document.querySelector('input[placeholder="Nome auditor"]').value =
        //     representanteNome;

    }

    if (empresa) {
        document.querySelector('input[placeholder="Empresa fornecedora"]').value =
            empresa.nomeFantasia || "Não informado";
    }

    document.querySelector('input[placeholder="Nome auditor"]').value = emissor;
}


// Comentários
const btnPost = document.querySelector(".btn-post");
const textarea = document.querySelector(".comment-textarea");
const commentsList = document.getElementById("comments-list");

async function enviarComentario(texto) {
    const usuarioString = window.sessionStorage.getItem("usuarioLogado");
    if (!usuarioString) return null;
    const usuarioObj = JSON.parse(usuarioString);
    const nomeUsuario = usuarioObj.nomeUsuario || "Desconhecido";

    const payload = {
        idNotaFiscal: identificadorNf,
        usuario: nomeUsuario,
        comentario: texto,
        data: new Date().toISOString()
    };

    try {
        const response = await fetch("http://localhost:8080/syntro/comentar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error(`Erro ao enviar comentário: ${response.status}`);
        const resultado = await response.json();
        return { ...payload, id: resultado.id || null };
    } catch (erro) {
        console.error(erro);
        return null;
    }
}

async function comentar() {
    const texto = textarea.value.trim();
    if (!texto) return;

    const comentario = await enviarComentario(texto);
    if (!comentario) return;

    const item = document.createElement("div");
    item.classList.add("comment-item");
    item.innerHTML = `
        <div class="comment-author">${comentario.usuario}</div>
        <div class="comment-text">${comentario.comentario}</div>
        <div class="comment-date">${new Date(comentario.data).toLocaleString()}</div>
    `;
    commentsList.prepend(item);
    textarea.value = "";
}

btnPost.addEventListener("click", comentar);

// Inicialização
window.addEventListener("DOMContentLoaded", async () => {
    await definirInputs();
    atualizarBotaoSeguir();
});
</script>
