    alert("Erro: ID da Nota Fiscal não encontrado ou inválido. Retornando para a página anterior.");
    console.error("Página individual.html carregada sem um NF-ID válido. Valor encontrado:", notaFiscalId);

    if (document.referrer) {
        window.history.back();
    } else {

}

const sessaoIdNf = document.getElementById("id_nf");

// Botão Seguir NF
const btnSeguir = document.getElementById("addNotaBtn");
const seguirKey = `seguir_${identificadorNf}`;
let estaSeguindo = sessionStorage.getItem(seguirKey) === "true";

function atualizarBotaoSeguir() {
    if (estaSeguindo) {
        btnSeguir.innerHTML = `<i class="bi bi-check-lg"></i> Seguindo`;
        btnSeguir.classList.remove("btn-primary");
        btnSeguir.classList.add("btn-success");
    } else {
        btnSeguir.innerHTML = `<i class="bi bi-plus-lg"></i> Seguir NF`;
        btnSeguir.classList.remove("btn-success");
        btnSeguir.classList.add("btn-primary");
    }
}

btnSeguir.addEventListener("click", () => {
    estaSeguindo = !estaSeguindo;
    sessionStorage.setItem(seguirKey, estaSeguindo);
    atualizarBotaoSeguir();
});

// Inputs da nota
const inputEntrada = document.getElementById("entrada");
const inputVencimento = document.getElementById("vencimento");
const inputEmissao = document.getElementById("emissao");
const inputCobranca = document.getElementById("cobranca");
const inputDescricao = document.getElementById("descricao");
const inputEmissor = document.getElementById("emissor");

// Função para carregar nota
async function carregarNota() {
    try {
        const url = `http://localhost:8080/syntro/nota-fiscal/${identificadorNf}`;
        const response = await fetch(url, { method: "GET", headers: { "Content-Type": "application/json" }});
        if (!response.ok) throw new Error(`Erro na requisição: ${response.status}`);
        const nota = await response.json();

        // Busca usuário emissor
        let nomeUsuario = "Não Informado";
        if (nota.idUsuario) {
            try {
                const userResponse = await fetch(`http://localhost:8080/syntro/user/${nota.idUsuario}`);
                if (userResponse.ok) {
                    const userData = await userResponse.json();
                    nomeUsuario = userData.nomeUsuario || nomeUsuario;
                }
            } catch (err) {
                console.warn(`Erro ao buscar usuário ${nota.idUsuario}:`, err);
            }
        }

        return {
            servico: nota.descricao || "Não informado",
            numero: nota.numeroIdentificador || "Sem número",
            valor: nota.valorTotal ?? 0,
            moeda: nota.nomeMoeda || "R$",
            vencimento: nota.dataVencimento ? new Date(nota.dataVencimento) : null,
            emissao: nota.dataEmissao ? new Date(nota.dataEmissao) : null,
            emissor: nomeUsuario,
            contrato: nota.idContrato,
            status: nota.status || "em-validacao"
        };
    } catch (error) {
        console.error("Erro ao buscar nota fiscal:", error);
        return null;
    }
}

// Função para definir inputs da nota
async function definirInputs() {
    const nota = await carregarNota();
    if (!nota) return;

    // Preenche datas
    if (nota.vencimento) inputVencimento.value = nota.vencimento.toISOString().split("T")[0];
    if (nota.emissao) {
        const pad = n => n.toString().padStart(2, "0");
        inputEmissao.value = `${nota.emissao.getFullYear()}-${pad(nota.emissao.getMonth()+1)}-${pad(nota.emissao.getDate())}T${pad(nota.emissao.getHours())}:${pad(nota.emissao.getMinutes())}`;
    }
    inputEmissor.value = nota.emissor;

    // Preenche valores
    inputCobranca.value = `R$ ${Number(nota.valor).toFixed(2).replace('.', ',')}`;
    inputDescricao.value = nota.servico;

    // Preenche dropdown status
    const savedStatus = sessionStorage.getItem(`status_${identificadorNf}`);
    const apiStatus = nota.status;
    const defaultStatusValue = "em-andamento-2";

    let statusToSet = defaultStatusValue; // Começa com o padrão

    // Prioriza sessionStorage, depois API, e por último o padrão.
    if (savedStatus && statusList.find(s => s.value === savedStatus)) {
        statusToSet = savedStatus;
    } else if (apiStatus && statusList.find(s => s.value === apiStatus)) {
        statusToSet = apiStatus;
    } else {
        if (apiStatus) {
             console.warn(`Status "${apiStatus}" da API não é válido. Usando o padrão.`);
        }
    }

    currentStatus = statusToSet;
    
    const initialStatus = statusList.find(s => s.value === currentStatus);
    if (initialStatus) {
        selected.innerHTML = `<span class="status-dot" style="background:${initialStatus.color}"></span> ${initialStatus.label}`;
    }
    renderDropdownOptions();

    // Renderiza contrato
    await renderizarInfoContrato(nota.contrato);
}

// Dropdown de status
const dropdown = document.getElementById('statusDropdown');
const selected = dropdown.querySelector('.status-selected span');
const optionsContainer = dropdown.querySelector('.status-options');

// Lista de status com a ordem correta e sem "Em validação"
const statusList = [
    { value: "nao-iniciado-1", label: "Não iniciado", color: "#6c757d" },
    { value: "em-andamento-2", label: "Em andamento", color: "#007bff" },
    { value: "aprovada-3", label: "Aprovada", color: "#28a745" },
    { value: "finalizada-4", label: "Finalizada", color: "#17a2b8" },
    { value: "congelada-5", label: "Congelada", color: "#ffc107" },
    { value: "reprovada-6", label: "Reprovada", color: "#dc3545" }
];

let currentStatus; // Será definido na função definirInputs()

// Função para fazer a chamada PUT para a API
async function updateStatusOnServer(newStatusValue) {
    // Usa a variável 'notaFiscalId' que já é pega do sessionStorage no topo do script
    if (!notaFiscalId) {
        console.error("ID da Nota Fiscal (NF-ID) não encontrado no sessionStorage.");
        alert("Erro: ID da Nota Fiscal não encontrado para a atualização.");
        return Promise.reject("ID da NF não encontrado.");
    }

    // Extrai o número do ID do status (ex: "em-andamento-2" -> "2")
    const statusId = newStatusValue.split('-').pop();
    if (!statusId || isNaN(parseInt(statusId))) {
        console.error("ID de status inválido:", newStatusValue);
        return Promise.reject("Status selecionado é inválido.");
    }

    const url = `http://localhost:8080/syntro/nota-fiscal/status/${notaFiscalId}?status=${statusId}`;

    try {
        const response = await fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) {
            const errorData = await response.text();
            throw new Error(`Falha ao atualizar o status: ${response.status} - ${errorData}`);
        }

        console.log(`Status da nota ${notaFiscalId} atualizado para ${newStatusValue}`);
        return Promise.resolve();

    } catch (error) {
        console.error("Erro ao fazer a chamada PUT:", error);
        alert(`Ocorreu um erro ao atualizar o status. A alteração foi desfeita.\nDetalhes: ${error.message}`);
        return Promise.reject(error);
    }
}

function renderDropdownOptions() {
    if (!optionsContainer) return;
    optionsContainer.innerHTML = "";
    statusList
        .filter(s => s.value !== currentStatus) // Mostra apenas as opções diferentes da atual
        .forEach(status => {
            const div = document.createElement("div");
            div.dataset.value = status.value;
            div.innerHTML = `<span class="status-dot" style="background:${status.color}"></span> ${status.label}`;
            optionsContainer.appendChild(div);

            // Adiciona o evento de clique para cada opção
            div.addEventListener("click", async (e) => {
                e.stopPropagation(); // Impede que o evento de fechar seja acionado

                const newStatusValue = status.value;
                const oldStatusValue = currentStatus;

                // Atualiza a UI otimisticamente
                currentStatus = newStatusValue;
                selected.innerHTML = `<span class="status-dot" style="background:${status.color}"></span> ${status.label}`;
                optionsContainer.style.display = "none";
                renderDropdownOptions(); // Re-renderiza a lista de opções

                // Tenta atualizar no servidor
                try {
                    await updateStatusOnServer(newStatusValue);
                    // Se sucesso, salva no sessionStorage
                    sessionStorage.setItem(`status_${identificadorNf}`, newStatusValue);
                } catch (error) {
                    // Se falhar, reverte a UI para o estado anterior
                    currentStatus = oldStatusValue;
                    const previousStatus = statusList.find(s => s.value === oldStatusValue);
                    if (previousStatus) {
                        selected.innerHTML = `<span class="status-dot" style="background:${previousStatus.color}"></span> ${previousStatus.label}`;
                    }
                    renderDropdownOptions(); // Re-renderiza para corrigir a lista de opções
                }
            });
        });
}

// Adiciona evento para abrir/fechar o dropdown
dropdown.querySelector('.status-selected').addEventListener('click', (e) => {
    e.stopPropagation();
    const currentDisplay = optionsContainer.style.display;
    optionsContainer.style.display = currentDisplay === 'flex' ? 'none' : 'flex';
    optionsContainer.style.flexDirection = 'column';
});

// Listener global para fechar o dropdown ao clicar fora
document.addEventListener('click', e => {
    if (dropdown && !dropdown.contains(e.target)) {
        optionsContainer.style.display = 'none';
    }
});

// Função para renderizar informações do contrato
async function renderizarInfoContrato(idContrato) {
    if (!idContrato) return;
    try {
        const url = `http://localhost:8080/syntro/contrato/${idContrato}`;
        const response = await fetch(url, { method: "GET", headers: { "Content-Type": "application/json" }});
        if (!response.ok) throw new Error(`Erro ao buscar contrato: ${response.status}`);
        const contrato = await response.json();

        // Representante
        let representanteNome = "Desconhecido";
        const representanteStr = window.sessionStorage.getItem("usuarioLogado");
        if (representanteStr) {
            const representanteObj = JSON.parse(representanteStr);
            representanteNome = representanteObj.nomeUsuario || representanteNome;
        }
        const responseEmpresa = await fetch(`http://localhost:8080/syntro/empresas/${contrato.idEmpresa}`);
        const empresa = await responseEmpresa.json();

        // Preenche campos do contrato
        document.querySelector('input[placeholder="Nome serviço"]').value = contrato.nomeServico || "Não informado";
        document.querySelector('input[placeholder="Empresa fornecedora"]').value = empresa.nomeFantasia || "Não informado";
        document.querySelector('input[placeholder="Nome auditor"]').value = representanteNome;
    } catch (error) {
        console.error("Erro ao renderizar contrato:", error);
    }
}

// Comentários
const btnPost = document.querySelector(".btn-post");
const textarea = document.querySelector(".comment-textarea");
const commentsList = document.getElementById("comments-list");

async function enviarComentario(texto) {
    const usuarioString = window.sessionStorage.getItem("usuarioLogado");
    if (!usuarioString) return null;
    const usuarioObj = JSON.parse(usuarioString);
    const nomeUsuario = usuarioObj.nomeUsuario || "Desconhecido";

    const payload = {
        tipoAcao: "Comentário",
        descricao: texto,
        dataHora: new Date().toISOString(),
        usuarioId: usuarioObj.id,
        notaFiscalId: notaFiscalId 
    };

    try {
        const response = await fetch("http://localhost:8080/syntro/comentar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });


        console.log("Resultado do comentário: ")
        console.log(response)

        if (!response.ok) throw new Error(`Erro ao enviar comentário: ${response.status}`);
        const resultado = await response.json();
        return { ...payload, id: resultado.id || null };
    } catch (erro) {
        console.error(erro);
        return null;
    }
}

async function comentar() {
    const texto = textarea.value.trim();
    if (!texto) return;

    const comentario = await enviarComentario(texto);
    if (!comentario) return;
    const usuarioString = window.sessionStorage.getItem("usuarioLogado");
    if (!usuarioString) return null;
    const usuarioObj = JSON.parse(usuarioString);

     
    const item = document.createElement("div");
    item.classList.add("comment-item");
    item.innerHTML = `
        <div class="comment-author">${usuarioObj.nomeUsuario}</div>
        <div class="comment-text">${comentario.descricao}</div>
        <div class="comment-date">${new Date(comentario.dataHora).toLocaleString()}</div>
    `;
    commentsList.prepend(item);
    textarea.value = "";
}

btnPost.addEventListener("click", comentar);

        item.classList.add("comment-item");
        item.innerHTML = `
            <div class="comment-author">${nomeComentador}</div>
            <div class="comment-text">${listaComentarios[i].descricao}</div>
            <div class="comment-date">${new Date(listaComentarios[i].dataHora).toLocaleString()}</div>
        `;

        commentsList.prepend(item);
    }
}

window.addEventListener('load', buscarComentarios())

// Inicialização
window.addEventListener("DOMContentLoaded", async () => {
    await definirInputs();
    atualizarBotaoSeguir();
});
</script>
