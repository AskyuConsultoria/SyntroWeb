<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syntro Web - Visualização empresas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="/assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="/styles/upload.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="/public/components/passwordChange/password.js"></script>
  <style>
    a {
      text-decoration: none;
    }

    th[data-col] {
      cursor: pointer;
      user-select: none;
    }
    tr { cursor: pointer; }
  </style>
</head>

<body style="background-color: #F1F5F8;">
  <div class="d-flex flex-row justify-content-between">
    <div><side-bar></side-bar></div>
    <div class="all-content">
      <div class="nav-content">
        <div class="d-flex flex-row align-items-center acesso">
          <span style="color: #5e5959;">Meu acesso | <a href="#" style="all: unset; cursor: pointer;">Empresas</a>
          </span>
          <div style="gap: 10px;">
            <div class="d-flex align-items-center gap-2">
              <div onclick="showPasswordChanger()" style="cursor: pointer;">
                <img src="/assets/Component 1.svg" style="height: 30px;">
                <span id="nomeUsuarioHeader"> ?</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="add-text-icon">
          <div class="d-flex flex-row gap-4 align-center">
            <div>
              <span>Empresas cadastradas</span>
              <img src="/assets/home.svg" style="height: 20px;">
            </div>
          </div>
        </div>

        <hr style="width: 90%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0,0,0,0.268);">

        <div class="d-flex flex-row gap-2">
          <div class="input-group" style="width: 300px; border-radius: 18px;">
            <span class="input-group-text" id="basic-addon1" style="background-color:#fff; border-right:0;">
              <i class="bi bi-search"></i>
            </span>
            <input type="search" id="searchInput" class="form-control" placeholder="Buscar nota..."
              style="border-left:0;">
          </div> <button id="addNotaBtn" class="btn btn-primary"
            style="background-color: #1A2A80; border-color: #1A2A80;" onclick="upload()">
            <i class="bi bi-plus-lg"></i> Adicionar Empresa
          </button>
        </div>
        <div class="d-flex align-center flex-column justify-content-evenly gap-4 mt-3">
          <div class="d-flex flex-row tags mt-2" style="gap: 15px;">
            <div>
              <span class="active" data-status="Todas">Todas</span>
              <span data-status="Minha Empresa">Minha Empresa <small id="qtdItens">:0</small></span>
              <span data-status="Empresas fornecedoras">Empresas fornecedoras <small id="qtdItens">:0</small></span>
              <span data-status="Empresas subsidiarias">Empresas subsidiarias <small id="qtdItens">:0</small></span>
            </div>
          </div>

          <div>
            <table class="table custom-table align-middle mb-0" style="margin-left:0;">
              <thead>
                <tr>
                  <th data-col="servico">Empresa <i class="bi bi-arrow-down-up"></i></th>
                  <th data-col="nota">Ramo de atuação <i class="bi bi-arrow-down-up"></i></th>
                  <th data-col="auditor">Identificação fiscal <i class="bi bi-arrow-down-up"></i></th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="/public/components/sidebar.js" type="module"></script>

  <script>
    const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
    const nomeHeader = document.getElementById('nomeUsuarioHeader');
    nomeHeader.innerHTML = usuarioLogado.nomeUsuario;

    const sidebarElement = document.querySelector('side-bar');
    const qtdItens = document.getElementById('qtdItens');
    if (sidebarElement) sidebarElement.addEventListener('toggle-sidebar', () => document.body.classList.toggle('sidebar-collapsed'));

    document.addEventListener("DOMContentLoaded", () => {
      const table = document.querySelector("table");
      if (!table) return;
      table.classList.add("card-table");
      const style = document.createElement("style");
      style.textContent = `
        .card-table { border-collapse: separate !important; border-spacing: 0 12px; width: 90%; background: transparent; border: none !important; }
        .card-table thead { background: transparent !important; }
        .card-table th { border: none !important; padding: 12px 16px; text-align: center; font-weight: 600; font-size: 0.95rem; color: #1A2A80; }
        .card-table th[data-col] { cursor: pointer; }
        .card-table th i { margin-left: 6px; font-size: 0.8rem; color: #A0A0A0; }
        .card-table tbody tr { background-color: transparent; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); transition: transform 0.2s, box-shadow 0.2s; }
        .card-table tbody tr td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        .card-table tbody tr td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        .card-table tbody tr:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card-table td { border: none !important; padding: 14px 16px; text-align: center; font-size: 0.92rem; background: white; }
      `;
      document.head.appendChild(style);
    });

    const tableBody = document.getElementById("tableBody");
    const tags = document.querySelectorAll(".tags span");
    const searchInput = document.getElementById("searchInput");

    let currentSort = { col: null, asc: true };

    const columnMap = {
      servico: "nome_fantasia",
      nota: "area_atuacao",
      auditor: "identificacao_fiscal"
    };

    function normalizarTexto(texto = "") {
      if (texto === null || texto === undefined) return "";
      return String(texto).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9\s]/g, "").toLowerCase();
    }

    async function renderTable(filtroStatus = "Todas", termoBusca = "", sortCol = null, asc = true) {
      tableBody.innerHTML = "";
      const listaEmpresas = await carregarEmpresas();
      const buscaNormalizada = normalizarTexto(termoBusca);
      let filtradas = listaEmpresas;

        if (filtroStatus.toLowerCase().includes("minha")) {
            filtradas = listaEmpresas.filter(e => e.id === 1);
        }

        else if (filtroStatus.toLowerCase().includes("fornecedora")) {
            filtradas = listaEmpresas.filter(e => e.fornecedor === true && e.id != 1 || e.fornecedor === 1 && e.id != 1);
        }

        else if (filtroStatus.toLowerCase().includes("subsidiaria")) {
            filtradas = listaEmpresas.filter(e => e.fornecedor === false);
        }

        else {
            filtradas = listaEmpresas;
        }

        filtradas = filtradas.filter(empresa => {
            const textoEmpresa = `${empresa.nome_fantasia ?? ""} ${empresa.area_atuacao ?? ""} ${empresa.identificacao_fiscal ?? ""}`;
            return normalizarTexto(textoEmpresa).includes(buscaNormalizada);
        });


      tags.forEach(tag => {
        if (tag.classList.contains("active")) {
          tag.textContent = `${tag.dataset.status} (${filtradas.length})`;
        } else {
          tag.textContent = tag.dataset.status;
        }
      });

      if (sortCol) {
        filtradas.sort((a, b) => {
          let valA = a[sortCol] ?? "";
          let valB = b[sortCol] ?? "";
          if (typeof valA === "string") valA = valA.toLowerCase();
          if (typeof valB === "string") valB = valB.toLowerCase();
          if (typeof valA === "string" && typeof valB === "string") return asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          return valA < valB ? (asc ? -1 : 1) : valA > valB ? (asc ? 1 : -1) : 0;
        });
      }

      if (!filtradas.length) {
        tableBody.innerHTML = `<tr><td colspan="3" class="text-muted">Nenhuma empresa encontrada.</td></tr>`;
        return;
      }

      filtradas.forEach(empresa => {
        const row = document.createElement("tr");
        row.onclick = () => abrirEmpresa(empresa.id);
        row.innerHTML = `
      <td>${empresa.nome_fantasia ?? empresa.nomeServico ?? "-"}</td>
      <td>${empresa.area_atuacao ?? "-"}</td>
      <td>${empresa.identificacao_fiscal ?? "000000000"}</td>
    `;
        tableBody.appendChild(row);
      });
    }

    renderTable("Todas");

    tags.forEach(tag => tag.addEventListener("click", () => {
      tags.forEach(t => t.classList.remove("active"));
      tag.classList.add("active");

      renderTable(tag.dataset.status, searchInput.value, currentSort.col, currentSort.asc);
    }));

    if (searchInput) {
      searchInput.addEventListener("input", () => {
        const tagAtiva = document.querySelector(".tags span.active");
        const filtro = tagAtiva ? tagAtiva.dataset.status : "Todas";
        renderTable(filtro, searchInput.value, currentSort.col, currentSort.asc);
      });
    }

    document.querySelectorAll("th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const dataCol = th.dataset.col;
        const prop = columnMap[dataCol];
        if (!prop) return;

        if (currentSort.col === prop) currentSort.asc = !currentSort.asc;
        else currentSort = { col: prop, asc: true };

        const tagAtiva = document.querySelector(".tags span.active");
        const filtro = tagAtiva ? tagAtiva.dataset.status : "Todas";
        renderTable(filtro, searchInput.value, currentSort.col, currentSort.asc);
      });
    });

    function upload() {
      window.location.href = "/cadastros/empresas";
    }

    async function carregarEmpresas() {
      try {
        const url = 'http://localhost:8080/syntro/empresas';
        const response = await fetch(url, { method: 'GET', headers: { 'Content-Type': 'application/json' } });
        if (!response.ok) throw new Error(`Erro: ${response.status}`);
        const data = await response.json();
        console.log("empresas:", data);

        return data.map(empresa => ({
          id: empresa.id,
          nomeServico: empresa.nomeServico,
          nome_fantasia: empresa.nomeFantasia,
          area_atuacao: empresa.areaAtuacao,
          identificacao_fiscal: empresa.identificacaoFiscal,
          tipo_identificacao_fiscal: empresa.tipoIdentificacaoFiscal,
          fornecedor: empresa.fornecedor
        }));
      } catch (error) {
        console.error("Erro ao carregar empresas:", error);
        return [];
      }
    }

    function abrirEmpresa(empresa) {

      sessionStorage.setItem("empresaSelecionada", JSON.stringify(empresa));
      window.location.href = "/empresas/detalhes";

    }
  </script>
</body>

</html>
