<html lang="en">

<head>
  <meta charset="UTF-8">

    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="/assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="/styles/upload.css">
  <script src="/public/components/sidebar.js"></script>
  <link rel="stylesheet" href="/styles/departamento-detalhes.css">
  <script src="/public/components/modal/modal.js"></script>
  <script src="/public/components/passwordChange/password.js"></script>
</head>

<style>

</style>

<body style="background-color: #F1F5F8;">
  <div class="d-flex flex-row justify-content-between">
    <div>
      <side-bar></side-bar>
    </div>
    <div class="all-content">
      <div class="nav-content">
        <div class="bnts" style="display: flex; width: 110px; justify-content: space-evenly;">
          <img src="/assets/arrow-square-right.svg" style="transform: rotate(180deg); cursor: pointer;"
            onclick="history.back()" alt="Voltar">
          <img src="/assets/arrow-square-right.svg" style="cursor: pointer;" onclick="history.forward()" alt="Avançar">
        </div>
        <div class="d-flex flex-row align-items-center acesso">
          <span style="color: #5e5959;">Meu acesso | <a href="/cadastros/home"
              style="all: unset; cursor: pointer;">Empresa</a></span>
          <div style="gap: 10px;">
            <div class="d-flex align-items-center gap-2">
              <!-- <div class="fornecedor-icon icon-btn d-flex align-items-center justify-content-evenly"
                style="cursor: pointer">
                <img src="/assets/bell.svg" style="height: 20px;">
              </div> -->
              <div>
                <img src="/assets/Component 1.svg" style="height: 30px; cursor: pointer;" onclick="showPasswordChanger()">
                <span id="nomeUsuarioHeader"> ?</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="add-text-icon">
          <span class="me-2" id="nomeEmpresa">Carregando...</span>
          <img src="/assets/building-3.svg" style="height: 20px;">
        </div>
        <hr style="width: 95%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
        <div style="width: 95%; padding-top: 2%;">
          <div class="d-flex">
            <div class="rounded-3 me-5 w-50 d-flex align-item-center justify-content-around"
            style="background-color: #FFFFFF; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
            <img src="/assets/bloom-search.svg" style="width: 5%; color:#7C2DB9" class="ms-3">
            <input type="text" id="searchMemberInput" class="form-control rounded border border-0"
              placeholder="Busque pelo membro">
          </div>
              <img src="/assets/add-square.svg" style="border-radius: 6px; padding:1% 3%; opacity: 0;">
          </div>

          <table class="table-bordered align-middle text-center mt-4 card-table">
            <thead>
              <tr>
                <th data-col="nome">Nome <i class="bi bi-arrow-down-up"></i></th>
                <th data-col="accessLevel">Usuario<i class="bi bi-arrow-down-up"></i></th>
              </tr>
            </thead>
            <tbody id="empresaTableBody">
              <tr>
                <td colspan="4" class="text-muted">Carregando membros...</td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>
    </div>
  </div>
</body>

<script>
const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
const nomeHeader = document.getElementById('nomeUsuarioHeader');
nomeHeader.innerHTML = usuarioLogado.nomeUsuario;
const empresaId = sessionStorage.getItem('empresaSelecionada');
let membrosOriginais = [];

  async function carregarEmpresa() {
    if (!empresaId) {
      document.getElementById('nomeEmpresa').innerText = "Empresa não definido";
      return;
    }

    try {
      const resposta = await fetch(`/syntro/empresas/${empresaId}`);
      if (!resposta.ok) throw new Error("Erro ao buscar empresa");
      const empresa = await resposta.json();
      console.log(empresa);

      document.getElementById('nomeEmpresa').innerText = "Empresa " + empresa.nomeFantasia;

      const usuarios = await fetch(`/syntro/user`);
      const todosUsuarios = await usuarios.json();
      const membrosEmpresa = todosUsuarios.filter(e => e.idEmpresa == empresaId);
      console.log(membrosEmpresa);
      membrosOriginais = membrosEmpresa || [];
      renderTabelaMembros(membrosOriginais);

    } catch (erro) {
      console.error(erro);
      document.getElementById('nomeEmpresa').innerText = "Erro ao carregar empresa";
    }
  }

  function renderTabelaMembros(membros) {
    const tableBody = document.getElementById("empresaTableBody");
    tableBody.innerHTML = "";

    if (!membros || membros.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="4" class="text-muted">Nenhum membro encontrado.</td></tr>`;
      return;
    }

    membros.forEach(membro => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${membro.nomeCompleto}</td>
        <td>${membro.nomeUsuario}</td>
      `;
      tableBody.appendChild(tr);
    });
  }

  document.getElementById("searchMemberInput").addEventListener("input", function () {
    const termo = this.value.toLowerCase().trim();

    const filtrados = membrosOriginais.filter(m =>
      m.nome.toLowerCase().includes(termo)
    );

    renderTabelaMembros(filtrados);
  });

  window.addEventListener('DOMContentLoaded', carregarEmpresa);

  document.getElementById("searchMemberInput").addEventListener("input", function () {
      const termo = this.value.toLowerCase();

      const filtrados = membrosOriginais.filter(m =>
          m.nomeUsuario?.toLowerCase().includes(termo) ||
          m.email?.toLowerCase().includes(termo) ||
          m.nomeCompleto?.toLowerCase().includes(termo)
      );

      renderTabelaMembros(filtrados);
  });

</script>
