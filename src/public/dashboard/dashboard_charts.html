<script>

    Chart.register(ChartjsPluginStacked100.default);
    function chart() {

        const ctx = document.getElementById('myChart');
        var config = {
            type: "bar",
            data: {
                // labels = coluna x
                labels: ['Davi', "Sarah", "Gabi","kayky","Nathan", "Erick", "Rosineide","Alexandre","Nathaniel","Amanda", "Danilo"],
                // datasets = coluna y
                datasets: [{
                    label: "Aprovadas",
                    // se na data tiver um array de dados, então retorna 2 dados por usuário?
                    data: [5, 12, 1, 6, 100],
                    backgroundColor: '#72CEFD'
                },{
                    label: "Reprovadas",
                    data:[3,6,7,1,9],
                    backgroundColor: '#855CF8'
                },{
                    label: "Não Lidas",
                    data: [20,10,30,14,26],
                    backgroundColor: '#9A9A9A'
                }]
            },
            options: {
                scales:{
                    x: {
                        stacked:true
                    }
                },
                responsive:true

            }
        }

        var chart = new Chart(ctx, config)

    }
</script>
