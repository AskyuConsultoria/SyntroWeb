<script>
    const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
    document.getElementById('nomeUsuarioHeader').textContent = usuarioLogado.nomeUsuario || '?';

    const meses = [
        "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
        "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
    ];
    const hoje = new Date();
    document.getElementById('mesAtual').textContent = meses[hoje.getMonth()];

    const sidebarElement = document.querySelector('side-bar');
    sidebarElement.addEventListener('toggle-sidebar', () => {
        document.body.classList.toggle('sidebar-collapsed');
    });

    function displayNotas(listaNotas) {
        const tableBody = document.getElementById("tableBody");
        tableBody.innerHTML = "";

        if (!listaNotas || listaNotas.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" class="text-muted">Nenhuma nota encontrada.</td></tr>`;
            return;
        }

        listaNotas.forEach(nota => {
            const row = document.createElement("tr");
            const servico = nota.servico || '';
            const numeroNota = nota.nota || '';
            const emissor = nota.emissor || '';
            const vencimento = nota.vencimento || '';
            const status = obterStatusString(nota.status);
            const valor = nota.valor || '';
            row.innerHTML = `
                <td>${servico}</td>
                <td>${numeroNota}</td>
                <td>${emissor}</td>
                <td>${vencimento}</td>
                <td>${status}</td>
                <td>${valor}</td>
            `;
            row.style.cursor = "pointer";
            row.addEventListener("click", () => {
                verIndividual(nota.nota, nota.id);
            });
            tableBody.appendChild(row);
        });
    }

    function obterStatusString(status){
        switch(status){
            case 1:
                return "Não Iniciada";
            case 2:
                return "Em Andamento";
            case 3:
                return "Finalizada";
            case 4:
                return "Finalizada";
            default:
                return "Desconhecido";
        }
    }

    document.getElementById("btnLimparFiltro").addEventListener("click", async () => {
        tableBody.innerHTML = '<tr><td colspan="6">Carregando...</td></tr>';
        const notas = await carregarNotas();
        displayNotas(notas);
    });

    async function CarregarNotasFinalizadas() {
        try {
            const todas = await carregarNotas();
            return todas.filter(n => n.status === 3 || n.status === 4);
        } catch (error) {
            console.error("Erro ao buscar finalizadas:", error);
            return [];
        }
    }

    async function atualizarContagensKPIs() {
        try {
            const [naoIniciada, emAndamento, aVencer, atrasadas, finalizadas] = await Promise.all([
                carregarNotasPorStatus(1),
                carregarNotasPorStatus(2),
                CarregarNotasAVencer(),
                CarregarNotasAtrasadas(),
                CarregarNotasFinalizadas()
            ]);

            document.getElementById('nao-iniciada').textContent = naoIniciada.length;
            document.getElementById('em-andamento').textContent = emAndamento.length;
            document.getElementById('a-vencer').textContent = aVencer.length;
            document.getElementById('atrasadas').textContent = atrasadas.length;
            document.getElementById('finalizadas').textContent = finalizadas.length;
        } catch (error) {
            console.error('Erro ao atualizar contagens dos KPIs:', error);
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const table = document.querySelector("table");
        if (!table) return;

        table.classList.add("card-table");

        const style = document.createElement("style");
        style.textContent = `
    /* Estilo apenas da tabela dessa página */
    .card-table {
      border-collapse: separate !important;
      border-spacing: 0 12px; /* espaçamento entre as linhas */
      width: 90%;
      background: transparent;
      border: none !important;
    }

    .card-table thead {
      background: transparent !important;
    }

    .card-table th {
      border: none !important;
      padding: 12px 16px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      color: #1A2A80;
    }

    .card-table th[data-col] {
      cursor: pointer;
    }

    .card-table th i {
      margin-left: 6px;
      font-size: 0.8rem;
      color: #A0A0A0;
    }

    .card-table tbody tr {
      background-color: transparent;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* Espaçamento visual entre as linhas */
    .card-table tbody tr td:first-child {
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    .card-table tbody tr td:last-child {
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .card-table tbody tr:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card-table td {
      border: none !important;
      padding: 14px 16px;
      text-align: center;
      font-size: 0.92rem;
      background: white;
    }
  `;
        document.head.appendChild(style);

        atualizarContagensKPIs();

        const kpiNaoIniciadas = document.getElementById('kpi-nao-iniciadas');
        const kpiEmAndamento = document.getElementById('kpi-em-andamento');
        const kpiAVencer = document.getElementById('kpi-a-vencer');
        const kpiAtrasadas = document.getElementById('kpi-atrasadas');
        const kpiFinalizadas = document.getElementById('kpi-finalizadas');

        if (kpiNaoIniciadas) {
            kpiNaoIniciadas.addEventListener('click', async () => {
                tableBody.innerHTML = '<tr><td colspan="6">Carregando...</td></tr>';
                const notas = await carregarNotasPorStatus(1);
                displayNotas(notas);
            });
        }

        if (kpiEmAndamento) {
            kpiEmAndamento.addEventListener('click', async () => {
                tableBody.innerHTML = '<tr><td colspan="6">Carregando...</td></tr>';
                const notas = await carregarNotasPorStatus(2);
                displayNotas(notas);
            });
        }

        if (kpiAVencer) {
            kpiAVencer.addEventListener('click', async () => {
                tableBody.innerHTML = '<tr><td colspan="6">Carregando...</td></tr>';
                const notas = await CarregarNotasAVencer();
                displayNotas(notas);
            });
        }

        if (kpiAtrasadas) {
            kpiAtrasadas.addEventListener('click', async () => {
                tableBody.innerHTML = '<tr><td colspan="6">Carregando...</td></tr>';
                const notas = await CarregarNotasAtrasadas();
                displayNotas(notas);
            });
        }

        if (kpiFinalizadas) {
            kpiFinalizadas.addEventListener('click', async () => {
            tableBody.innerHTML = '<tr><td colspan="6">Carregando...</td></tr>';
            const notas = await carregarNotasFinalizadas();
            displayNotas(notas);
        });
    }
    });

    const tableBody = document.getElementById("tableBody");
    const tags = document.querySelectorAll(".tags span");
    const searchInput = document.getElementById("searchInput");
    let currentSort = { col: null, asc: true };

    function normalizarTexto(texto) {
        return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9\s]/g, "").toLowerCase();
    }

    async function renderTable(filtroStatus = "Todas", termoBusca = "", sortCol = null, asc = true) {
        tableBody.innerHTML = "";
        const listaNotas = await carregarNotas();
        console.log("Lista de Notas: ", listaNotas)
        const buscaNormalizada = normalizarTexto(termoBusca);
        let filtradas = listaNotas.filter(nota => {
            const matchStatus = filtroStatus === "Todas" || nota.status === filtroStatus;
            const textoNota = Object.values(nota).join(" ");
            return matchStatus && normalizarTexto(textoNota).includes(buscaNormalizada);
        });

        if (sortCol) {
            filtradas.sort((a, b) => {
                let valA = a[sortCol];
                let valB = b[sortCol];

                if (sortCol === "vencimento") {
                    const [dA, mA, aA] = valA.split("/").map(Number);
                    const [dB, mB, aB] = valB.split("/").map(Number);
                    valA = new Date(aA, mA - 1, dA);
                    valB = new Date(aB, mB - 1, dB);
                }

                if (sortCol === "valor") {
                    valA = Number(valA.replace(/[^\d,]/g, "").replace(",", "."));
                    valB = Number(valB.replace(/[^\d,]/g, "").replace(",", "."));
                }

                if (valA < valB) return asc ? -1 : 1;
                if (valA > valB) return asc ? 1 : -1;
                return 0;
            });
        }

        if (filtradas.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" class="text-muted">Nenhuma nota encontrada.</td></tr>`;
            return;
        }
        filtradas.forEach(nota => {
            const row = document.createElement("tr");
            row.innerHTML = `
    <td>${nota.servico}</td>
    <td>${nota.nota}</td>
    <td>${nota.emissor}</td>
    <td>${nota.vencimento}</td>
    <td>${obterStatusString(nota.status)}</td>
    <td>${nota.valor}</td>
  `;
            row.style.cursor = "pointer"; // deixa o cursor de click
            row.addEventListener("click", () => {
                verIndividual(nota.nota, nota.id); // ou nota.id se tiver
            });
            tableBody.appendChild(row);
        });
    }
    renderTable("Todas");

    tags.forEach(tag => tag.addEventListener("click", () => {
        tags.forEach(t => t.classList.remove("active"));
        tag.classList.add("active");
        renderTable(tag.dataset.status, searchInput.value, currentSort.col, currentSort.asc);
    }));

    searchInput.addEventListener("input", () => {
        const tagAtiva = document.querySelector(".tags span.active");
        renderTable(tagAtiva.dataset.status, searchInput.value, currentSort.col, currentSort.asc);
    });

    document.querySelectorAll("th[data-col]").forEach(th => th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (currentSort.col === col) currentSort.asc = !currentSort.asc;
        else currentSort = { col: col, asc: true };
        const tagAtiva = document.querySelector(".tags span.active");
        renderTable(tagAtiva.dataset.status, searchInput.value, currentSort.col, currentSort.asc);
    }));

    function upload() {
        window.location.href = "/upload";
    }

    async function carregarNotas() {
        try {
            var url = 'http://localhost:8080/syntro/nota-fiscal'
            if (usuarioLogado?.emissor == true) {
                url = `http://localhost:8080/syntro/nota-fiscal/empresa?empresaId=${usuarioLogado.idEmpresa}`;
            }
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Erro na requisição: ${response.status}`);
            }

            const data = await response.json();

            const listaNotas = await Promise.all(
                data.map(async (nota) => {
                    let nomeUsuario = "Não Informado";

                    if (nota.idUsuario) {
                        try {
                            const userResponse = await fetch(`http://localhost:8080/syntro/user/${nota.idUsuario}`);
                            if (userResponse.ok) {
                                const userData = await userResponse.json();
                                nomeUsuario = userData.nomeUsuario;
                            }
                        } catch (err) {
                            console.warn(`Não foi possível buscar o usuário ${nota.idUsuario}:`, err);
                        }
                    }
                    var servicoNota = nota.descricao;
                    if (nota.idContrato) {
                        try {
                            const contratoResponse = await fetch(`http://localhost:8080/syntro/contrato/${nota.idContrato}`);
                            if (contratoResponse.ok) {
                                const contratoData = await contratoResponse.json();
                                servicoNota = contratoData.nomeServico;
                            }
                        } catch (err) {
                            console.warn(`Não foi possível buscar o usuário ${nota.idUsuario}:`, err);
                        }
                    }
                    return {
                        id: nota.id,
                        servico: servicoNota,
                        nota: nota.numeroIdentificador,
                        valor: `${nota.nomeMoeda ? nota.nomeMoeda : "R$ "}${nota.valorTotal}`,
                        vencimento: nota.dataVencimento ? formatarData(new Date(nota.dataVencimento)) : null,
                        idEmpresa: nota.idEmpresa,
                        emissor: nomeUsuario,
                        status: nota.status,
                        idUsuario: nota.idUsuario
                    };
                })
            );
            console.log(listaNotas);
            return listaNotas;

        } catch (error) {
            console.error('Erro ao buscar notas fiscais:', error);
            return [];
        }
    }

                        idEmpresa: nota.idEmpresa,
                        emissor: nomeUsuario,
                        status: nota.status,
                        idUsuario: nota.idUsuario
                    };
                })
            );
            console.log(listaNotas);
            return listaNotas;

        } catch (error) {
            console.error('Erro ao buscar notas fiscais por status:', error);
            return [];
        }
    }

    async function CarregarNotasAtrasadas() {
        try {
            const dataDeHoje = new Date().toISOString().split('T')[0];
            const url = `http://localhost:8080/syntro/nota-fiscal/data-vencimento/menor-que?data=${dataDeHoje}`;
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Erro na requisição: ${response.status}`);
            }

            const data = await response.json();

            const listaNotas = await Promise.all(
                data.map(async (nota) => {
                    let nomeUsuario = "Não Informado";

                    if (nota.idUsuario) {
                        try {
                            const userResponse = await fetch(`http://localhost:8080/syntro/user/${nota.idUsuario}`);
                            if (userResponse.ok) {
                                const userData = await userResponse.json();
                                nomeUsuario = userData.nomeUsuario;
                            }
                        } catch (err) {
                            console.warn(`Não foi possível buscar o usuário ${nota.idUsuario}:`, err);
                        }

    async function CarregarNotasAVencer() {
        try {
            const dataFim = new Date();
            dataFim.setDate(dataFim.getDate() + 7);
            dataFim.setHours(23, 59, 59, 999);

            const dataInicio = new Date();
            dataInicio.setHours(0, 0, 0, 0);

            const formatForURL = (date) => {
                const pad = (num) => num.toString().padStart(2, '0');
                const year = date.getFullYear();
                const month = pad(date.getMonth() + 1);
                const day = pad(date.getDate());
                const hours = pad(date.getHours());
                const minutes = pad(date.getMinutes());
                const seconds = pad(date.getSeconds());
                return `${year}-${month}-${day}T${hours}:${minutes}:${seconds}`;
            };

            const url = `http://localhost:8080/syntro/nota-fiscal/data-vencimento/entre?dataInicio=${formatForURL(dataInicio)}&dataFim=${formatForURL(dataFim)}`;
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Erro na requisição: ${response.status}`);
            }

            const data = await response.json();

            const listaNotas = await Promise.all(
                data
                    .filter(nota => nota.status === 1 || nota.status === 2)
                    .map(async (nota) => {
                    let nomeUsuario = "Não Informado";

                    if (nota.idUsuario) {
                        try {
                            const userResponse = await fetch(`http://localhost:8080/syntro/user/${nota.idUsuario}`);
                            if (userResponse.ok) {
                                const userData = await userResponse.json();
                                nomeUsuario = userData.nomeUsuario;
                            }
                        } catch (err) {
                            console.warn(`Não foi possível buscar o usuário ${nota.idUsuario}:`, err);
                        }
                    }
                    var servicoNota = nota.descricao;
                    if (nota.idContrato) {
                        try {
                            const contratoResponse = await fetch(`http://localhost:8080/syntro/contrato/${nota.idContrato}`);
                            if (contratoResponse.ok) {
                                const contratoData = await contratoResponse.json();
                                servicoNota = contratoData.nomeServico;
                            }
                        } catch (err) {
                            console.warn(`Não foi possível buscar o contrato ${nota.idContrato}:`, err);
                        }
                    }
                    return {
                        id: nota.id,
                        servico: servicoNota,
                        nota: nota.numeroIdentificador,
                        valor: `${nota.nomeMoeda ? nota.nomeMoeda : "R$ "}${nota.valorTotal}`,
                        vencimento: nota.dataVencimento ? formatarData(new Date(nota.dataVencimento)) : null,
                        idEmpresa: nota.idEmpresa,
                        emissor: nomeUsuario,
                        status: nota.status,
                        idUsuario: nota.idUsuario
                    };
                })
            );
            console.log(listaNotas);
            return listaNotas;

        } catch (error) {
            console.error('Erro ao buscar notas fiscais a vencer:', error);
            return [];
        }
    }

    function formatarData(data) {
        if (!data) return null;

        const d = new Date(data);

        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const ano = d.getFullYear();

        return `${dia}/${mes}/${ano}`;
    }

    async function carregarDadosChart() {
    const agora = new Date();
    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, "0");

    const mesAtual = `${ano}-${mes}`; // exemplo: 2025-12

    try {
        const response = await fetch(`http://localhost:8080/syntro/nota-fiscal/periodo?inicio=${mesAtual}&fim=${mesAtual}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        });

        if (!response.ok) {
            throw new Error("Erro: " + response.status);
        }

        const data = await response.json();
        console.log("Dados do mês atual:", data);
        return data;

    } catch (erro) {
        console.error("Erro ao chamar /periodo:", erro);
    }
