<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Syntro Web - Visualização Contratos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="/assets/syntro_icon.png" type="image/x-icon" />
    <link rel="stylesheet" href="/styles/upload.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="/public/components/passwordChange/password.js"></script>
    <style>
        a {
            text-decoration: none;
        }

        th[data-col] {
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body style="background-color: #F1F5F8;">
    <div class="d-flex flex-row justify-content-between">
        <div><side-bar></side-bar></div>
        <div class="all-content">
            <div class="nav-content">
                <div class="d-flex flex-row align-items-center acesso">
                    <span style="color: #5e5959;">Meu acesso | <a href="#"
                            style="all: unset; cursor: pointer;">Serviços</a></span>
                    <div class="d-flex align-items-center gap-2">
                        <div>
                            <img src="/assets/Component 1.svg" style="height: 30px; cursor: pointer;" onclick="showPasswordChanger()">
                            <span id="nomeUsuarioHeader"> ?</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="d-flex flex-row gap-2 mb-2">
                    <div class="add-text-icon">
                        <div class="d-flex flex-row gap-4 align-center">
                            <div>
                                <span>Serviços cadastrados</span>
                                <img src="/assets/box.svg" style="height: 20px;">
                            </div>
                        </div>
                    </div>
                </div>

                <hr style="height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0,0,0,0.268);">
                <div class="d-flex flex-row gap-3">
                    <div>
                    <div class="input-group" style="width: 300px; border-radius: 18px;">
                        <span class="input-group-text" id="basic-addon1" style="background-color:#fff; border-right:0;">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="search" id="searchInput" class="form-control" placeholder="Buscar serviços..."
                            style="border-left:0;">
                    </div>
                </div>
                <button id="addNotaBtn" class="btn btn-primary"
                    style="background-color: #1A2A80; border-color: #1A2A80;" onclick="upload()">
                    <i class="bi bi-plus-lg"></i> Adicionar acesso
                </button>
                </div>
            </div>

            <div class="d-flex flex-row tags mt-4" style="gap: 15px;">
                <div><span class="active" data-status="Todas">Todos</span></div>
                <div><span data-status="Em andamento">Serviços seguidos</span></div>
            </div>

            <div class="d-flex flex-column gap-4 mt-1">
                <table class="table-bordered align-middle mt-2 card-table">
                    <thead>
                        <tr>
                            <th data-col="servico">Serviço <i class="bi bi-arrow-down-up"></i></th>
                            <th data-col="empresa">Empresa <i class="bi bi-arrow-down-up"></i></th>
                            <th data-col="valor">Valor <i class="bi bi-arrow-down-up"></i></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    </div>

    <script src="/public/components/sidebar.js" type="module"></script>

    <script>
        const CONTRATOS_URL = '/syntro/contrato/contratos';
        const EMPRESAS_URL = '/syntro/empresas';

        const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado") || '{}');
        document.getElementById('nomeUsuarioHeader').textContent = usuarioLogado.nomeUsuario || '?';

        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const tags = document.querySelectorAll('.tags span');

        let currentSort = { col: null, asc: true };

        function normalizarTexto(t = '') {
            return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        async function fetchTodasEmpresas() {
            try {
                const r = await fetch(EMPRESAS_URL);
                if (!r.ok) throw new Error();
                const empresas = await r.json();
                const map = new Map();
                empresas.forEach(e => map.set(e.id, e));
                return map;
            } catch (e) { console.error("Erro ao buscar empresas:", e); return new Map(); }
        }

        async function fetchContratos() {
            try {
                const r = await fetch(CONTRATOS_URL);
                if (!r.ok) throw new Error();
                return await r.json();
            } catch (e) { console.error("Erro ao buscar contratos:", e); return []; }
        }

        async function carregarContratosComEmpresas() {
            const [contratos, empresasMap] = await Promise.all([fetchContratos(), fetchTodasEmpresas()]);
            return contratos.map(c => {
                const emp = empresasMap.get(c.idEmpresa);
                return {
                    nomeServico: c.nomeServico ?? '',
                    empresaNome: emp?.nomeFantasia ?? '-',
                    valor: c.valor ?? null,
                    moeda: c.nome_Moeda ?? 'BRL'
                };
            });
        }

        function aplicarEstiloTabela() {
            const style = document.createElement("style");
            style.textContent = `
                .card-table { border-collapse: separate !important; border-spacing: 0 12px; width: 90%; background: transparent; border: none !important; margin-top: 12px;}
                .card-table thead { background: transparent !important; }
                .card-table th { border: none !important; padding: 12px 16px; text-align: left !important; font-weight: 600; font-size: 0.95rem; color: #1A2A80; }
                .card-table th i { margin-left: 6px; font-size: 0.8rem; color: #A0A0A0; }
                .card-table tbody tr { background-color: white; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); transition: transform 0.2s, box-shadow 0.2s; }
                .card-table tbody tr:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
                .card-table tbody tr td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
                .card-table tbody tr td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
                .card-table td { border: none !important; padding: 14px 16px; text-align: left !important; font-size: 0.92rem; }
            `;
            document.head.appendChild(style);
        }

        function formatarValor(valor, moeda) {
            if (valor == null) return '-';
            return (moeda === 'BRL' ? 'R$' : '$') + ' ' + Number(valor).toFixed(2);
        }

        async function renderTable(busca = '', sortCol = null, asc = true) {
            aplicarEstiloTabela();
            tableBody.innerHTML = '';
            const lista = await carregarContratosComEmpresas();
            const filtroNormalizado = normalizarTexto(busca);

            let filtradas = lista.filter(i => {
                const txt = normalizarTexto(`${i.nomeServico} ${i.empresaNome} ${i.valor ?? ''}`);
                return filtroNormalizado === '' || txt.includes(filtroNormalizado);
            });

            tags.forEach(tag => {
                if (tag.classList.contains("active")) {
                    tag.textContent = `${tag.dataset.status} (${filtradas.length})`;
                } else {
                    tag.textContent = tag.dataset.status;
                }
            });

            if (sortCol) {
                filtradas.sort((a, b) => {
                    let A = a[sortCol], B = b[sortCol];
                    if (sortCol === 'valor') { A = A ?? -Infinity; B = B ?? -Infinity; return asc ? A - B : B - A; }
                    return asc ? String(A).localeCompare(String(B)) : String(B).localeCompare(String(A));
                });
            }

            if (filtradas.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="text-muted">Nenhum serviço encontrado.</td></tr>`;
                return;
            }

            filtradas.forEach(i => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${i.nomeServico}</td>
                    <td>${i.empresaNome}</td>
                    <td>${formatarValor(i.valor, i.moeda)}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        renderTable('', currentSort.col, currentSort.asc);

        searchInput?.addEventListener('input', () => renderTable(searchInput.value, currentSort.col, currentSort.asc));

        tags.forEach(tag => tag.addEventListener('click', () => {
            tags.forEach(t => t.classList.remove('active'));
            tag.classList.add('active');
            renderTable(searchInput.value, currentSort.col, currentSort.asc);
        }));

        document.querySelectorAll('th[data-col]').forEach(th => {
            th.addEventListener('click', () => {
                const propMap = { servico: 'nomeServico', empresa: 'empresaNome', valor: 'valor' };
                const prop = propMap[th.dataset.col];
                if (!prop) return;
                if (currentSort.col === prop) currentSort.asc = !currentSort.asc;
                else { currentSort.col = prop; currentSort.asc = true; }
                renderTable(searchInput.value, currentSort.col, currentSort.asc);
            });
        });

        function upload() { window.location.href = '/cadastros/servicos'; }
    </script>
</body>

</html>
