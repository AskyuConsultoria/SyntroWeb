<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syntro Web - Cadastro Empresas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/sidebar.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="../../assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="../../styles/cadastro.css">
  <script src="../components/sidebar.js"></script>
    <script src="../../services/cadastro/backendCadastroEmpresa.js"></script>
</head>
<style>a{text-decoration: none;}</style>

<body style="background-color: #F1F5F8;">
  <div class="d-flex flex-row justify-content-between">
    <div>
      <side-bar></side-bar>
    </div>
    <div class="all-content">
      <div class="nav-content">
        <div class="bnts" style="display: flex; width: 110px; justify-content: space-evenly;">
          <img src="../../assets/arrow-square-right.svg" style="transform: rotate(180deg); cursor: pointer;" onclick="history.back()" alt="Voltar">
          <img src="../../assets/arrow-square-right.svg" style="cursor: pointer;" onclick="history.forward()" alt="Avançar">
        </div>
        <div class="d-flex flex-row align-items-center acesso">
          <span style="color: #5e5959;">Meu acesso | <a href="cadastros-home.html" style="all: unset; cursor: pointer;">Cadastro</a> | Empresa </span>
          <div style="gap: 10px;" >
            <div class="d-flex align-items-center gap-2">
              <div class="fornecedor-icon icon-btn d-flex align-items-center justify-content-evenly" style="cursor: pointer">
              <img src="../../assets/bell.svg" style="height: 20px;">
            </div>
            <div>
              <img src="../../assets/Component 1.svg" style="height: 30px;">
            <span>Fornecedor</span>
            </div>
            </div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="add-text-icon">
          <span>Cadastro</span>
          <img src="../../assets/folder-add2.svg" style="height: 20px;">
        </div>
        <hr style="width: 90%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
        <div class="box-titulo">
          <div style="width: 95%; margin-left: 2.5%; padding-top: 1%; padding-bottom: 1%;">
            <div style="display: flex; flex-direction: column;">
              <span style="font-size: 20px;">Cadastrar uma Empresa Fornecedora</span>
            </div>
          </div>
        </div>
        <div>
         <div class="cadastro-card">
            <div class="cadastro-form-card">
              <div class="cadastro-form-row">
                <div class="cadastro-form-group">
                  <label for="cnpj">CNPJ *</label>
                  <input type="text" id="cnpj" placeholder="00.000.000/0001-00">
                </div>

                <div class="cadastro-form-group">
                  <label for="razaoSocial">Razão Social *</label>
                  <input type="text" id="razaoSocial" placeholder="Insira a razão social">
                </div>

                <div class="cadastro-form-group">
                  <label for="tipoEmpresa">Tipo de Empresa *</label>
                  <input type="text" id="tipoEmpresa" placeholder="Insira o tipo de empresa">
                </div>
              </div>

              <div class="cadastro-form-row">
                <div class="cadastro-form-group cadastro-form-small">
                  <label for="cep">CEP *</label>
                  <input type="text" id="cep" placeholder="00000-000">
                </div>

                <div class="cadastro-form-group cadastro-form-small">
                  <label for="uf">UF *</label>
                  <input type="text" id="uf" placeholder="Insira a UF">
                </div>

                <div class="cadastro-form-group">
                  <label for="cidade">Cidade *</label>
                  <input type="text" id="cidade" placeholder="Insira a Cidade">
                </div>

                <div class="cadastro-form-group">
                  <label for="bairro">Bairro *</label>
                  <input type="text" id="bairro" placeholder="Insira o bairro">
                </div>
              </div>

              <div class="cadastro-form-row">
                <div class="cadastro-form-group cadastro-form-large">
                  <label for="logradouro">Logradouro *</label>
                  <input type="text" id="logradouro" placeholder="Insira o logradouro">
                </div>

                <div class="cadastro-form-group cadastro-form-large">
                  <label for="complemento">Complemento</label>
                  <input type="text" id="complemento" placeholder="Insira o complemento">
                </div>
              </div>
              <div class="empresa-form-actions">
                <button class="empresa-salvar-btn">Salvar</button>
              </div>
            </div>

        </div>
      </div>
    </div>
  </div>
  </div>

</body>

</html>

<script>
const sidebarElement = document.querySelector('side-bar');

sidebarElement.addEventListener('toggle-sidebar', () => {
  document.body.classList.toggle('sidebar-collapsed');
});

  document.addEventListener("DOMContentLoaded", () => {
    const cepInput = document.getElementById("cep");
    const ufInput = document.getElementById("uf");
    const cidadeInput = document.getElementById("cidade");
    const bairroInput = document.getElementById("bairro");
    const logradouroInput = document.getElementById("logradouro");

    cepInput.addEventListener("input", async () => {
      const cep = cepInput.value.replace(/\D/g, "");

      if (cep.length === 8) {
        try {
          const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
          const data = await response.json();

          if (data.erro) {
            alert("CEP não encontrado!");
            return;
          }

          ufInput.value = data.uf || "";
          cidadeInput.value = data.localidade || "";
          bairroInput.value = data.bairro || "";
          logradouroInput.value = data.logradouro || "";
        } catch (error) {
          console.error("Erro ao buscar CEP:", error);
          alert("Erro ao buscar o CEP. Tente novamente.");
        }
      }
    });
  });
</script>
