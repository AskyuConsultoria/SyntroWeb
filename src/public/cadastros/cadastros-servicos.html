<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syntro Web - Cadastro Serviços</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="/assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="/styles/cadastro.css">
  <script src="/public/components/sidebar.js"></script>
  <script src="/services/cadastro/backendCadastroServico.js"></script>
  <script src="/public/components/modal/modal.js"></script>
  <script src="/public/components/passwordChange/password.js"></script>
</head>
<style>a{text-decoration: none;}</style>

<body style="background-color: #F1F5F8;">
  <div class="d-flex flex-row justify-content-between">
    <div>
      <side-bar></side-bar>
    </div>
    <div class="all-content">
      <div class="nav-content">
        <div class="bnts" style="display: flex; width: 110px; justify-content: space-evenly;">
          <img src="/assets/arrow-square-right.svg" style="transform: rotate(180deg); cursor: pointer;" onclick="history.back()" alt="Voltar">
          <img src="/assets/arrow-square-right.svg" style="cursor: pointer;" onclick="history.forward()" alt="Avançar">
        </div>
        <div class="d-flex flex-row align-items-center acesso">
          <span style="color: #5e5959;">Meu acesso | <a href="/cadastros/home" style="all: unset; cursor: pointer;">Cadastro</a> | Serviços </span>
          <div style="gap: 10px;" >
            <div class="d-flex align-items-center gap-2">
              <!-- <div class="fornecedor-icon icon-btn d-flex align-items-center justify-content-evenly" style="cursor: pointer">
              <img src="/assets/bell.svg" style="height: 20px;">
            </div> -->
            <div>
              <img src="/assets/Component 1.svg" style="height: 30px; cursor: pointer;" onclick="showPasswordChanger()">
            <span id="nomeUsuarioHeader"> ?</span>
            </div>
            </div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="add-text-icon">
          <span>Cadastro</span>
          <img src="/assets/folder-add2.svg" style="height: 20px;">
        </div>
        <hr style="width: 90%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
        <div class="box-titulo">
          <div style="width: 95%; margin-left: 2.5%; padding-top: 1%; padding-bottom: 1%;">
            <div style="display: flex; flex-direction: column;">
              <span style="font-size: 20px;">Informações do serviço</span>
            </div>
          </div>
        </div>
        <div>
          <div class="servico-alert-box">
            <span class="servico-alert-icon">ⓘ</span>
            <div class="servico-alert-content">
              <strong>Cadastro de Serviço</strong><br>
              Antes de adicionar um serviço, tenha certeza de ter o representante dele cadastrado,
              para assim conseguir o selecionar nessa etapa.
            </div>
            <span class="servico-alert-close" onclick="this.parentElement.style.display='none'">x</span>
          </div>

          <div class="servico-form-card">
            <div class="servico-form-row">

              <div class="servico-form-group">
                <label for="empresaFornecedor">Empresa Fornecedora *</label>
                <select id="empresaFornecedor" onchange="carregarEmissores()">
                  <option>Selecione a Empresa</option>
                </select>
              </div>

              <div class="servico-form-group">
                <label for="representante">Nome do Emissor *</label>
                <select id="representante">
                  <option>Selecione o Emissor</option>
                </select>
              </div>


              <div class="servico-form-group">
                <label for="cargoRepresentante">Cargo/Função *</label>
                <input type="text" id="cargoRepresentante" placeholder="Insira o Cargo/Função do Representante">
              </div>
            </div>

            <div class="servico-form-row">
              <div class="servico-form-group">
                <label for="nomeServico">Nome do Serviço *</label>
                <input type="text" id="nomeServico" placeholder="Nomeie o Serviço">
              </div>

              <div class="servico-form-group">
                <label for="dataInicio">Data de Início *</label>
                <input type="text" id="dataInicio" placeholder="DD / MM / AAAA">
              </div>

              <div class="servico-form-group">
                <label for="frequenciaCobranca">Frequência da Cobrança *</label>
                <select id="frequenciaCobranca">
                  <option>Mensal</option>
                  <option>Bimestral</option>
                  <option>Trimestral</option>
                  <option>Anual</option>
                </select>
              </div>

              <div class="servico-form-group">
                <label for="duracaoContrato">Duração do Contrato *</label>
                <input type="text" id="duracaoContrato" placeholder="X meses">
              </div>
            </div>

            <div class="servico-form-row">
              <div class="servico-form-group">
                <label for="moedaCobranca">Moeda da Cobrança *</label>
                <select id="moedaCobranca">
                  <option>Selecione a moeda</option>
                  <option value="R$">R$</option>
                  <option value="US$">US$</option>
                </select>
              </div>

              <div class="servico-form-group">
                <label for="valorCobranca">Valor da Cobrança *</label>
                <input type="text" id="valorCobranca" placeholder="99999,99">
              </div>

              <div class="servico-form-group">
                <label for="representanteInterno">Auditor *</label>
                <select id="representanteInterno">
                  <option>Selecione o Auditor</option>
                </select>
              </div>
            </div>

            <div class="servico-form-row">
              <div class="servico-form-group servico-descricao">
                <label for="descricaoServico">Descrição do Serviço</label>
                <textarea id="descricaoServico" rows="4" maxlength="500" placeholder="Anote suas observações"></textarea>
                <div class="servico-contador">0/500</div>
              </div>
            </div>

            <div class="servico-form-actions">
              <button class="servico-salvar-btn">Salvar</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
  </div>

</body>

</html>

<script>
const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
const nomeHeader = document.getElementById('nomeUsuarioHeader');
nomeHeader.innerHTML = usuarioLogado.nomeUsuario;
  const sidebarElement = document.querySelector('side-bar');

  sidebarElement.addEventListener('toggle-sidebar', () => {
    document.body.classList.toggle('sidebar-collapsed');
  });

</script>
<script>
  const desc = document.getElementById('descricaoServico');
  const contador = document.querySelector('.servico-contador');
  desc.addEventListener('input', () => {
    contador.textContent = `${desc.value.length}/500`;
  });

  async function carregarEmpresas() {
      try {
          const response = await fetch('/syntro/empresas');
          if (!response.ok) throw new Error('Erro ao buscar empresas');
          
          const empresas = await response.json();
          const select = document.getElementById('empresaFornecedor');
          
          empresas.forEach(emp => {
              const option = document.createElement('option');
              option.value = emp.id; 
              option.textContent = emp.nomeFantasia;
              select.appendChild(option);
          });
      } catch (error) {
          console.error('Erro ao carregar empresas:', error);
      }
      try {
          const response = await fetch(`/syntro/user/auditor`);
          if (!response.ok) throw new Error('Erro ao buscar auditores');
          
          const empresas = await response.json();
          const select = document.getElementById('representanteInterno');
          
          empresas.forEach(emp => {
              const option = document.createElement('option');
              option.value = emp.id; 
              option.textContent = emp.nomeUsuario;
              select.appendChild(option);
          });
      } catch (error) {
          console.error('Erro ao carregar auditores:', error);
      }
  }

  async function carregarEmissores(){
    var idEmpresa = document.getElementById('empresaFornecedor').value;
    try {
          const response = await fetch(`/syntro/user/emissor/${idEmpresa}`);
          if (!response.ok) throw new Error('Erro ao buscar emissores');
          
          const empresas = await response.json();
          const select = document.getElementById('representante');
          
          empresas.forEach(emp => {
              const option = document.createElement('option');
              option.value = emp.id; 
              option.textContent = emp.nomeUsuario;
              select.appendChild(option);
          });
      } catch (error) {
          console.error('Erro ao carregar emissores:', error);
      }
  }

  window.addEventListener('DOMContentLoaded', carregarEmpresas);
</script>
