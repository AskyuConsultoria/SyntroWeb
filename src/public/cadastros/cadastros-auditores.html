<script>
  const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
const nomeHeader = document.getElementById('nomeUsuarioHeader');
nomeHeader.innerHTML = usuarioLogado.nomeUsuario;
const sidebarElement = document.querySelector('side-bar');

sidebarElement.addEventListener('toggle-sidebar', () => {
  document.body.classList.toggle('sidebar-collapsed');
});

async function preencherSelectDepartamentosAuditor() {
  const select = document.getElementById("departamentoAuditor");

  select.innerHTML = '<option value="">Selecione</option>';


  const departamentos = await carregarDepartamentos();


  departamentos.forEach(dep => {
    const option = document.createElement("option");
    option.value = dep.id;
    option.textContent = dep.nome;
    select.appendChild(option);
  });
}

window.addEventListener("DOMContentLoaded", () => {
  preencherSelectDepartamentosAuditor();
});

async function carregarDepartamentos() {
      try {
        const response = await fetch("http://localhost:8080/syntro/departamentos");
        if (!response.ok) throw new Error("Erro ao buscar departamentos");
        const data = await response.json();

        return data.map(dept => ({
          id: dept.id,
          nome: dept.nome,
          qtdMembros: dept.qtdMembros ?? 0,
          servicosAtivos: dept.servicosAtivos ?? 0
        }));
      } catch (error) {
        console.error(error);
        return [];
      }
    }

  </script>
