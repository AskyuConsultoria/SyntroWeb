<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syntro Web - Departamentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="/assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="/styles/upload.css">
  <link rel="stylesheet" href="/styles/departamento.css">
  <script src="/public/components/sidebar.js" type="module"></script>
  <style>
    a {
      text-decoration: none;
    }
    th[data-col] {
      cursor: pointer;
    }
  </style>
</head>
<body style="background-color: #F1F5F8;">
  <div id="memberForm" 
  style="position: fixed; top: 0; right: -100%; width: 30%; height: 100%; background-color: #FFFFFF; 
  box-shadow: -4px 0 8px rgba(0,0,0,0.2); transition: right 0.3s; z-index: 1000; display: none;">

  <button onclick="closeForm()" 
    style="width: 7%; border-color:#1A2A80;background: none;border-radius: 35%; margin: 10px;">
      <img src="/assets/close-icon.svg" style="color:#1A2A80">
  </button>

  <div class="d-flex flex-column" style="padding: 5% 10%; width:100%; height:100%;">
    
    <h3>Novo Departamento</h3>

    <div class="d-flex flex-column" style="width:100%; margin-top:10%">
      <span class="mb-3">Nome do departamento *</span>
      <input class="p-2 border rounded cinza border-black" 
             type="text" 
             placeholder="Insira o nome"
             id="nomeDepartamento">
    </div>

    <div class="d-flex justify-content-between w-100 mt-5">
      <button class="cancel"
        style="background-color: #FFFFFF;border-color: #7C2DB9; border-radius: 16px; padding:3% 5%;"
        onclick="closeForm()">Cancelar</button>

      <button class="save rounded"
        style="background-color: #7C2DB9;color: #FFFFFF;font-weight:bold; padding:3% 5%;border:none;"
        onclick="salvarDepartamento()">Adicionar</button>
    </div>
  </div>
</div>

  <div class="d-flex flex-row justify-content-between">
    <div>
      <side-bar></side-bar>
    </div>
    <div class="all-content">
      <div class="nav-content">
        <div class="bnts" style="display: flex; width: 110px; justify-content: space-evenly;">
          <img src="/assets/arrow-square-right.svg" style="transform: rotate(180deg); cursor: pointer;" onclick="history.back()" alt="Voltar">
          <img src="/assets/arrow-square-right.svg" style="cursor: pointer;" onclick="history.forward()" alt="Avançar">
        </div>
        <div class="d-flex flex-row align-items-center acesso">
          <span style="color: #5e5959;">Meu acesso |  <a href="/cadastros/home" style="all: unset; cursor: pointer;">Cadastro</a> | Departamentos </span>
          <div style="gap: 10px;">
            <div class="d-flex align-items-center gap-2">
              <div class="fornecedor-icon icon-btn d-flex align-items-center justify-content-evenly"
                style="cursor: pointer">
                <img src="/assets/bell.svg" style="height: 20px;">
              </div>
              <div>
                <img src="/assets/Component 1.svg" style="height: 30px;">
                <span id="nomeUsuarioHeader"> ?</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="add-text-icon">
          <span>Departamentos</span>
          <img src="/assets/folder-add2.svg" style="height: 20px;">
        </div>
        <hr style="width: 100%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
        
        <div style="width: 95%; padding-top: 2%;">
          <div class="d-flex mb-3">
            <div class="rounded-3 me-5 w-50 d-flex align-item-center justify-content-around"
              style="background-color: #FFFFFF; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
              <img src="/assets/bloom-search.svg" style="width: 5%; color:#7C2DB9" class="ms-3">
              <input type="text" id="searchDeptInput" class="form-control rounded border border-0" placeholder="Busque pelo departamento">
            </div>
            <div class="purple outline-purple align-items-center d-flex justify-content-between"
                style="border-radius: 6px; padding:1%; cursor:pointer;" 
                onclick="toggleForm()">
              <img src="/assets/add-square.svg">
            </div>
          </div>

          <!-- Tabela dinâmica -->
          <div>
            <table class="table-bordered align-middle text-center mt-2" id="departamentoTable">
              <thead>
                <tr>
                  <th data-col="nome">Nome <i class="bi bi-arrow-down-up"></i></th>
                  <th data-col="qtdMembros">Qtd. Membros <i class="bi bi-arrow-down-up"></i></th>
                  <th data-col="servicosAtivos">Serviços Ativos <i class="bi bi-arrow-down-up"></i></th>
                </tr>
              </thead>
              <tbody id="departamentoTableBody">
                <!-- Conteúdo será gerado dinamicamente -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
const nomeHeader = document.getElementById('nomeUsuarioHeader');
nomeHeader.innerHTML = usuarioLogado.nomeUsuario;
    document.addEventListener("DOMContentLoaded", () => {
      const table = document.getElementById("departamentoTable");
      if (!table) return;

      table.classList.add("card-table");

      const style = document.createElement("style");
      style.textContent = `
        .card-table {
          border-collapse: separate !important;
          border-spacing: 0 12px;
          width: 100%;
          background: transparent;
          border: none !important;
        }
        .card-table thead {
          background: transparent !important;
        }
        .card-table th {
          border: none !important;
          padding: 12px 16px;
          text-align: center;
          font-weight: 600;
          font-size: 0.95rem;
          color: #1A2A80;
        }
        .card-table th[data-col] {
          cursor: pointer;
        }
        .card-table th i {
          margin-left: 6px;
          font-size: 0.8rem;
          color: #A0A0A0;
        }
        .card-table tbody tr {
          background-color: white;
          border-radius: 12px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.08);
          transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-table tbody tr td:first-child {
          border-top-left-radius: 12px;
          border-bottom-left-radius: 12px;
        }
        .card-table tbody tr td:last-child {
          border-top-right-radius: 12px;
          border-bottom-right-radius: 12px;
        }
        .card-table tbody tr:hover {
          transform: translateY(-2px);
          box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .card-table td {
          border: none !important;
          padding: 14px 16px;
          text-align: center;
          font-size: 0.92rem;
        }
      `;
      document.head.appendChild(style);

      renderDepartamentoTable();
    });

    let currentDeptSort = { col: null, asc: true };
    const searchDeptInput = document.getElementById("searchDeptInput");
    const departamentoTableBody = document.getElementById("departamentoTableBody");

    async function carregarDepartamentos() {
      try {
        const response = await fetch("http://localhost:8080/syntro/departamentos");
        if (!response.ok) throw new Error("Erro ao buscar departamentos");
        const data = await response.json();

        return data.map(dept => ({
          id: dept.id,
          nome: dept.nome,
          qtdMembros: dept.qtdMembros ?? 0,
          servicosAtivos: dept.servicosAtivos ?? 0
        }));
      } catch (error) {
        console.error(error);
        return [];
      }
    }

    async function renderDepartamentoTable(sortCol = null, asc = true) {
      departamentoTableBody.innerHTML = "";
      const listaDepartamentos = await carregarDepartamentos();
      const termoBusca = searchDeptInput.value.toLowerCase();

      let filtrados = listaDepartamentos.filter(d => d.nome.toLowerCase().includes(termoBusca));

      if (sortCol) {
        filtrados.sort((a, b) => {
          if (a[sortCol] < b[sortCol]) return asc ? -1 : 1;
          if (a[sortCol] > b[sortCol]) return asc ? 1 : -1;
          return 0;
        });
      }

      if (filtrados.length === 0) {
        departamentoTableBody.innerHTML = `<tr><td colspan="3" class="text-muted">Nenhum departamento encontrado.</td></tr>`;
        return;
      }

      filtrados.forEach(dept => {
        departamentoTableBody.insertAdjacentHTML("beforeend", `
          <tr onclick="abrirDepartamento(${dept.id})" style="cursor: pointer;">
            <td>${dept.nome}</td>
            <td>${dept.qtdMembros}</td>
            <td>${dept.servicosAtivos}</td>
          </tr>
        `);
      });
    }

    searchDeptInput.addEventListener("input", () => renderDepartamentoTable(currentDeptSort.col, currentDeptSort.asc));

    document.querySelectorAll("#departamentoTable th[data-col]").forEach(th => th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (currentDeptSort.col === col) currentDeptSort.asc = !currentDeptSort.asc;
      else currentDeptSort = { col, asc: true };
      renderDepartamentoTable(currentDeptSort.col, currentDeptSort.asc);
    }));

    function toggleForm() {
      const memberDiv = document.getElementById('memberForm');

      if (memberDiv.style.display === 'block') {
        closeForm();
      } else {
        openForm();
      }
    }


    function abrirDepartamento(departamento) {

      sessionStorage.setItem("departamentoSelecionado", JSON.stringify(departamento));
      window.location.href = "/cadastros/departamentos/detalhes";

    }

  function openForm() {
    const memberDiv = document.getElementById('memberForm');
    memberDiv.style.display = 'block';
    setTimeout(() => memberDiv.style.right = '0', 10);
  }

  function closeForm() {
    const memberDiv = document.getElementById('memberForm');
    memberDiv.style.right = '-100%';
    setTimeout(() => memberDiv.style.display = 'none', 300);
  }

  async function salvarDepartamento() {
    const nomeDepartamento = document.getElementById("nomeDepartamento").value;

    if (!nomeDepartamento) {
        alert("Insira um nome para o departamento.");
        return;
    }

      try {
          const resposta = await fetch("http://localhost:8080/syntro/departamentos", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify({
                  nomeDepartamento: nomeDepartamento
              })
          });

          if (!resposta.ok) {
              throw new Error("Erro ao salvar departamento");
          }

          alert("Departamento criado com sucesso!");
          closeForm();
          window.location.reload();
      } catch (erro) {
          console.error(erro);
          alert("Erro ao criar departamento.");
      }
  }

  </script>
</body>
</html>
