<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syntro Web - Departamentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="/assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="/styles/upload.css">
  <script src="/public/components/sidebar.js"></script>
  <link rel="stylesheet" href="/styles/departamento-detalhes.css">
  <script src="/public/components/modal/modal.js"></script>
  <script src="/public/components/passwordChange/password.js"></script>
</head>

<style>

</style>

<body style="background-color: #F1F5F8;">
  <div id="memberForm" style="position: fixed; top: 0; right: -100%; width: 30%; height: 100%; background-color: #FFFFFF; 
      box-shadow: -4px 0 8px rgba(0,0,0,0.2); transition: right 0.3s; z-index: 1000; display: none;">

    <button onclick="closeForm()"
      style="width: 7%; border-color:#1A2A80;background: none;border-radius: 35%; margin: 10px;">
      <img src="/assets/close-icon.svg" style="color:#1A2A80">
    </button>

    <div class="d-flex flex-column" style="padding: 5% 10%; width:100%; height:100%;">
      <h3>Adicionar membro ao departamento</h3>

      <!-- SELECT USUÁRIOS -->
      <div class="d-flex flex-column" style="width:100%; margin-top:10%">
        <span class="mb-3">Usuário *</span>
        <select id="usuarioSelect" class="p-2 rounded form-select border border-black" style="background-color:#FFFFFF;"
          onchange="mostrarNivelAtual()">
          <option value="">Selecione</option>
        </select>

        <!-- NÍVEL ATUAL COMO SPAN -->
        <span id="nivelAtual" class="mt-2" style="font-weight: bold;">Nível atual: -</span>
      </div>

      <!-- SELECT PARA NOVO ACCESS LEVEL -->
      <div class="d-flex flex-column" style="width:100%; margin-top:10%">
        <span class="mb-3">Novo nível de acesso *</span>
        <select id="accessLevel" class="p-2 rounded form-select border border-black" style="background-color:#FFFFFF;">
          <option value="">Selecione</option>
          <option value="Adm. Interno">Adm. Interno</option>
          <option value="Gestor">Gestor</option>
          <option value="Auditor">Auditor</option>
        </select>
      </div>

      <!-- BOTÕES -->
      <div class="d-flex justify-content-between w-100 mt-5">
        <button class="cancel"
          style="background-color: #FFFFFF;border-color: #7C2DB9; border-radius: 16px; padding:3% 5%;"
          onclick="closeForm()">Cancelar</button>

        <button class="save rounded" onclick="addMember()"
          style="background-color: #7C2DB9;color: #FFFFFF;font-weight:bold; padding:3% 5%;border:none;">Salvar</button>
      </div>
    </div>
  </div>

  <div class="d-flex flex-row justify-content-between">
    <div>
      <side-bar></side-bar>
    </div>
    <div class="all-content">
      <div class="nav-content">
        <div class="bnts" style="display: flex; width: 110px; justify-content: space-evenly;">
          <img src="/assets/arrow-square-right.svg" style="transform: rotate(180deg); cursor: pointer;"
            onclick="history.back()" alt="Voltar">
          <img src="/assets/arrow-square-right.svg" style="cursor: pointer;" onclick="history.forward()" alt="Avançar">
        </div>
        <div class="d-flex flex-row align-items-center acesso">
          <span style="color: #5e5959;">Meu acesso | <a href="/cadastros/home"
              style="all: unset; cursor: pointer;">Cadastro</a> | <a href="/cadastros/departamentos"
              style="all: unset; cursor: pointer;">Departamento</a> </span>
          <div style="gap: 10px;">
            <div class="d-flex align-items-center gap-2">
              <!-- <div class="fornecedor-icon icon-btn d-flex align-items-center justify-content-evenly"
                style="cursor: pointer">
                <img src="/assets/bell.svg" style="height: 20px;">
              </div> -->
              <div>
                <img src="/assets/Component 1.svg" style="height: 30px; cursor: pointer;" onclick="showPasswordChanger()">
                <span id="nomeUsuarioHeader"> ?</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="content">
        <div class="add-text-icon">
          <span class="me-2" id="nomeDepartamento">Carregando...</span>
          <img src="/assets/folder-add2.svg" style="height: 20px;">
        </div>
        <hr style="width: 95%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
        <div style="width: 95%; padding-top: 2%;">
          <div class="d-flex">
            <div class="rounded-3 me-5 w-50 d-flex align-item-center justify-content-around"
              style="background-color: #FFFFFF; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
              <img src="/assets/bloom-search.svg" style="width: 5%;color:#7C2DB9" class="ms-3">
              <input type="text" id="searchMemberInput" class="form-control rounded border border-0"
                placeholder="Busque pelo membro">
            </div>
            <button onclick="openForm()"
              class="border purple outline-purple align-items-center d-flex justify-content-between;"
              style="border-radius: 6px;padding:1% 3%; background-color: #F1F5F8;">
              <img src="/assets/add-square.svg">
              <span class="purple bold ms-3">Adicionar novo membro</span>
            </button>
          </div>

          <table class="table-bordered align-middle text-center mt-4 card-table">
            <thead>
              <tr>
                <th data-col="nome">Nome <i class="bi bi-arrow-down-up"></i></th>
                <th data-col="accessLevel">Acesso Level <i class="bi bi-arrow-down-up"></i></th>
              </tr>
            </thead>
            <tbody id="departamentoTableBody">
              <tr>
                <td colspan="4" class="text-muted">Carregando membros...</td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>
    </div>
  </div>
</body>

<script>
  const usuarioLogado = JSON.parse(sessionStorage.getItem("usuarioLogado"));
const nomeHeader = document.getElementById('nomeUsuarioHeader');
nomeHeader.innerHTML = usuarioLogado.nomeUsuario;
  const departamentoId = sessionStorage.getItem('departamentoSelecionado');
  let membrosOriginais = []; // ✅ Guardar membros carregados

  async function carregarDepartamento() {
    if (!departamentoId) {
      document.getElementById('nomeDepartamento').innerText = "Departamento não definido";
      return;
    }

    try {
      const resposta = await fetch(`http://localhost:8080/syntro/departamentos/${departamentoId}`);
      if (!resposta.ok) throw new Error("Erro ao buscar departamento");

      const departamento = await resposta.json();

      document.getElementById('nomeDepartamento').innerText = "Departamento de " + departamento.nome;

      membrosOriginais = departamento.membros || [];
      renderTabelaMembros(membrosOriginais);

    } catch (erro) {
      console.error(erro);
      document.getElementById('nomeDepartamento').innerText = "Erro ao carregar departamento";
    }
  }

  function renderTabelaMembros(membros) {
    const tableBody = document.getElementById("departamentoTableBody");
    tableBody.innerHTML = "";

    if (!membros || membros.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="4" class="text-muted">Nenhum membro encontrado.</td></tr>`;
      return;
    }

    membros.forEach(membro => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${membro.nome}</td>
        <td>${membro.accessLevel}</td>
      `;
      tableBody.appendChild(tr);
    });
  }

  document.getElementById("searchMemberInput").addEventListener("input", function () {
    const termo = this.value.toLowerCase().trim();

    const filtrados = membrosOriginais.filter(m =>
      m.nome.toLowerCase().includes(termo)
    );

    renderTabelaMembros(filtrados);
  });

  window.addEventListener('DOMContentLoaded', carregarDepartamento);


  async function openForm() {
    if(usuarioLogado.permissao == "Auditor"){
      showModal("Você não tem permissão para adicionar membros.", "error");
      return
    }
    const panel = document.getElementById("memberForm");
    panel.style.display = "block";

    await carregarUsuarios();

    setTimeout(() => {
      panel.style.right = "0";
    }, 10);
  }
  function closeForm() {
    const panel = document.getElementById("memberForm");
    panel.style.right = "-100%";

    setTimeout(() => {
      panel.style.display = "none";
    }, 300);
  }


  async function addMember() {
    const idUsuario = document.getElementById("usuarioSelect").value;
    const accessLevel = document.getElementById("accessLevel").value;
    const idDepartamento = sessionStorage.getItem("departamentoSelecionado");

    if (!idUsuario || !accessLevel || !idDepartamento) {
      showModal("Preencha todos os campos.", "error");
      return;
    }

    try {
      const resposta = await fetch(`http://localhost:8080/syntro/user/${idUsuario}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          idDepartamento: Number(idDepartamento),
          permissao: accessLevel
        })
      });

      if (!resposta.ok) {
        throw new Error("Erro ao atualizar o usuário");
      }

      showModal("Usuário atualizado com sucesso!", "success");
      closeForm();

    } catch (erro) {
      console.error(erro);
      showModal("Erro ao salvar alterações.", "error");
    }
  }

  var listaUsuarios = [];
  async function carregarUsuarios() {
    try {
      const resposta = await fetch("http://localhost:8080/syntro/user/auditor");

      if (!resposta.ok) {
        throw new Error("Erro ao buscar usuários");
      }

      const usuarios = await resposta.json();
      const select = document.getElementById("usuarioSelect");

      select.innerHTML = "<option value=''>Selecione</option>";

      usuarios.forEach(u => {
        const option = document.createElement("option");
        option.value = u.id;
        option.textContent = u.nomeUsuario;
        option.dataset.accessLevel = u.accessLevel;
        select.appendChild(option);
      });
      listaUsuarios = usuarios;

    } catch (erro) {
      console.error(erro);
      showModal("Erro ao carregar lista de usuários.", "error");
    }
  }
  function mostrarNivelAtual() {
    const select = document.getElementById("usuarioSelect");
    const idSelecionado = Number(select.value);
    const nivelAtualSpan = document.getElementById("nivelAtual");

    if (!idSelecionado) {
      nivelAtualSpan.textContent = "Nível atual: -";
      return;
    }

    const usuario = listaUsuarios.find(u => u.id === idSelecionado);
    if (!usuario) {
      nivelAtualSpan.textContent = "Nível atual: -";
      return;
    }

    const nivel = usuario.permissao || "Não definido";
    nivelAtualSpan.textContent = "Nível atual: " + nivel;
  }

  function podeAlterarPermissao(usuarioAlvo, novaPermissao) {
    const nivelAtual = usuarioLogado.permissao; 
    const nivelAlvo = usuarioAlvo.permissao;  

    if (nivelAlvo < nivelAtual) {
        showModal("Você não tem permissão para alterar alguém com cargo maior que o seu.", "error");
        return false;
    }

    if (novaPermissao <= nivelAtual) {
        showModal("Você não pode atribuir uma permissão maior que a sua.", "error");
        return false;
    }

    return true;
}

</script>
