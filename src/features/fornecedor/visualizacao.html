<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syntro Web - Visualização notas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../components/sidebar.js">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="../../assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="../../styles/upload.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    a {
      text-decoration: none;
    }

    th[data-col] {
      cursor: pointer;
    }
  </style>
</head>

<body style="background-color: #F1F5F8;">
  <div class="d-flex flex-row justify-content-between">
    <div>
      <side-bar></side-bar>
    </div>
    <div class="all-content">
      <div class="content">
        <div class="add-text-icon">
          <div class="d-flex flex-row gap-4 align-center">
            <div>
              <span>Notas registradas</span>
              <img src="../../assets/home.svg" style="height: 20px;">
            </div>
            <input type="search" id="searchInput" class="form-control search-bar" placeholder="Buscar nota...">
            <button id="addNotaBtn" class="btn btn-primary" style="background-color: #1A2A80; border-color: #1A2A80;"
              onclick="upload()">
              <i class="bi bi-plus-lg"></i> Adicionar Nota Fiscal
            </button>
          </div>
        </div>
        <hr style="width: 90%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
        <div>
          <div class="d-flex align-center flex-column justify-content-evenly gap-4 ">
            <div class="d-flex flex-row tags mt-2" style="gap: 15px;">
              <div><span class="active" data-status="Todas">Todas</span></div>
              <div><span data-status="Em andamento">Em andamento</span></div>
              <div><span data-status="Em validação">Em validação</span></div>
              <div><span data-status="Aprovada">Aprovadas</span></div>
              <div><span data-status="Congelada">Congeladas</span></div>
              <div><span data-status="Reprovada">Reprovadas</span></div>
            </div>
            <div>
              <table class="table table-striped table-bordered align-middle text-center mt-2">
                <thead>
                  <tr>
                    <th data-col="servico">Serviço<i class="bi bi-arrow-down-up"></i></th>
                    <th data-col="nota">Nº Da Nota <i class="bi bi-arrow-down-up"></i></th>
                    <th data-col="auditor">Auditor <i class="bi bi-arrow-down-up"></i></th>
                    <th data-col="vencimento">Dta vencimento <i class="bi bi-arrow-down-up"></i></th>
                    <th data-col="status">Status <i class="bi bi-arrow-down-up"></i></th>
                    <th data-col="valor">Valor <i class="bi bi-arrow-down-up"></i></th>
                  </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../components/sidebar.js" type="module"></script>
  <script src="../components/navcontent.js" type="module"></script>
  <script>
    const sidebarElement = document.querySelector('side-bar');
    sidebarElement.addEventListener('toggle-sidebar', () => {
      document.body.classList.toggle('sidebar-collapsed');
    });

    const notasMock = [
      { id: 1, servico: "Serviço de Consultoria Técnica", nota: "NF-001245", auditor: "Mariana Costa", vencimento: "15/11/2025", status: "Em andamento", valor: "R$ 2.500,00" },
      { id: 2, servico: "Treinamento de Equipe", nota: "NF-001246", auditor: "João Ribeiro", vencimento: "22/11/2025", status: "Aprovada", valor: "R$ 1.800,00" },
      { id: 3, servico: "Auditoria Interna", nota: "NF-001247", auditor: "Ana Souza", vencimento: "30/11/2025", status: "Em validação", valor: "R$ 3.200,00" },
      { id: 4, servico: "Serviço Contábil", nota: "NF-001248", auditor: "Carlos Lima", vencimento: "05/12/2025", status: "Congelada", valor: "R$ 1.000,00" },
      { id: 5, servico: "Auditoria Externa", nota: "NF-001249", auditor: "Fernanda Dias", vencimento: "10/12/2025", status: "Reprovada", valor: "R$ 2.000,00" }
    ];

    const tableBody = document.getElementById("tableBody");
    const tags = document.querySelectorAll(".tags span");
    const searchInput = document.getElementById("searchInput");
    let currentSort = { col: null, asc: true };

    function normalizarTexto(texto) {
      return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9\s]/g, "").toLowerCase();
    }

    function renderTable(filtroStatus = "Todas", termoBusca = "", sortCol = null, asc = true) {
      tableBody.innerHTML = "";
      const buscaNormalizada = normalizarTexto(termoBusca);
      let filtradas = notasMock.filter(nota => {
        const matchStatus = filtroStatus === "Todas" || nota.status === filtroStatus;
        const textoNota = Object.values(nota).join(" ");
        return matchStatus && normalizarTexto(textoNota).includes(buscaNormalizada);
      });

      if (sortCol) {
        filtradas.sort((a, b) => {
          let valA = a[sortCol];
          let valB = b[sortCol];

          if (sortCol === "vencimento") {
            const [dA, mA, aA] = valA.split("/").map(Number);
            const [dB, mB, aB] = valB.split("/").map(Number);
            valA = new Date(aA, mA - 1, dA);
            valB = new Date(aB, mB - 1, dB);
          }

          if (sortCol === "valor") {
            valA = Number(valA.replace(/[^\d,]/g, "").replace(",", "."));
            valB = Number(valB.replace(/[^\d,]/g, "").replace(",", "."));
          }

          if (valA < valB) return asc ? -1 : 1;
          if (valA > valB) return asc ? 1 : -1;
          return 0;
        });
      }

      if (filtradas.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" class="text-muted">Nenhuma nota encontrada.</td></tr>`;
        return;
      }

      filtradas.forEach(nota => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${nota.servico}</td>
          <td>${nota.nota}</td>
          <td>${nota.auditor}</td>
          <td>${nota.vencimento}</td>
          <td>${nota.status}</td>
          <td>${nota.valor}</td>
        `;
        row.style="cursor: pointer"
        row.addEventListener("click", () => {
          verIndividual(nota.id);
        });
        tableBody.appendChild(row);
      });
    }

    function verIndividual(id) {
      window.localStorage.setItem('id', id)
      window.location.href = "individual.html";
    }

    renderTable("Todas");

    tags.forEach(tag => tag.addEventListener("click", () => {
      tags.forEach(t => t.classList.remove("active"));
      tag.classList.add("active");
      renderTable(tag.dataset.status, searchInput.value, currentSort.col, currentSort.asc);
    }));

    searchInput.addEventListener("input", () => {
      const tagAtiva = document.querySelector(".tags span.active");
      renderTable(tagAtiva.dataset.status, searchInput.value, currentSort.col, currentSort.asc);
    });

    document.querySelectorAll("th[data-col]").forEach(th => th.addEventListener("click", () => {
      const col = th.dataset.col;
      if (currentSort.col === col) currentSort.asc = !currentSort.asc;
      else currentSort = { col: col, asc: true };
      const tagAtiva = document.querySelector(".tags span.active");
      renderTable(tagAtiva.dataset.status, searchInput.value, currentSort.col, currentSort.asc);
    }));

    function upload() {
      window.location.href = "../upload/upload.html";
    }
  </script>
</body>

</html>
