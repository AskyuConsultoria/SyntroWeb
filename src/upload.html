<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Syntro Web - Upload de notas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/sidebar.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="./assets/syntro_icon.png" type="image/x-icon" />
  <link rel="stylesheet" href="./styles/upload.css">
  <script src="sidebar.js"></script>
</head>
<style>a{text-decoration: none;}</style>

<body style="background-color: #F1F5F8;">
  <div class="d-flex flex-row justify-content-between">
    <div>
      <side-bar></side-bar>
    </div>
    <div class="all-content">
      <div class="nav-content">
        <div class="bnts" style="display: flex; width: 110px; justify-content: space-evenly;">
          <img src="./assets/arrow-square-right.svg" style="transform: rotate(180deg); cursor: pointer;" onclick="history.back()" alt="Voltar">
          <img src="./assets/arrow-square-right.svg" style="cursor: pointer;" onclick="history.forward()" alt="Avançar">
        </div>
        <div class="d-flex flex-row align-items-center acesso">
          <span style="color: #5e5959;">Meu acesso | Adicionar notas</span>
          <div style="gap: 10px;" >
            <div class="d-flex align-items-center gap-2">
              <div class="fornecedor-icon icon-btn d-flex align-items-center justify-content-evenly" style="cursor: pointer">
              <img src="assets/bell.svg" style="height: 20px;">
            </div>
            <div>
              <img src="./assets/Component 1.svg" style="height: 30px;">
            <span>Fornecedor</span>
            </div>
            </div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="add-text-icon">
          <span>Adicionar NFs</span>
          <img src="./assets/folder-add.svg" style="height: 20px;">
        </div>
        <hr style="width: 90%; height: 1px; background: #e0e0e0; box-shadow: 0 4px 4px rgba(0, 0, 0, 0.268);">
        <div class="box-upload">
          <div style="width: 95%; margin-left: 2.5%; padding-top: 2%;">
            <div style="display: flex; flex-direction: column;">
              <span style="font-weight: bold; font-size: 20px; margin-bottom: 3px;">Upload de arquivos</span>
              <span>Adicione seus documentos aqui. Você pode enviar até 1 uma nota por vez</span>
            </div>
            <div class="pontilhado">
              <div class="dropzone upload" id="dropzone">
                <div class="d-flex flex-column gap-2">
                  <img src="./assets/upload.svg" style="height: 50px;">
                  <span>Arraste seu arquivo e realize o upload</span>
                </div>
                <div class="divider">
                  <span>OU</span>
                </div>
                <div>
                  <!-- Apenas um input, escondido -->
                  <input type="file" id="fileInput" hidden accept=".jpg,.png,.svg,.zip,.pdf">
                  <button class="btn btn-upload" type="button" id="inputPDFButton">Escolha um arquivo</button>
                </div>
              </div>

            </div>
            <div class="mt-3">
              <span class="suportados">Arquivos suportados .jpg, .png and .svg e arquivos .zip</span>
              <div class="d-flex justify-content-end gap-3">
                <button class="btn btn-action" type="button">Cancelar</button>
                <button class="btn btn-action" type="button">Enviar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  <script src="script.js"></script>

</body>

</html>

<script>
const sidebarElement = document.querySelector('side-bar');

sidebarElement.addEventListener('toggle-sidebar', () => {
  document.body.classList.toggle('sidebar-collapsed');
});

  </script>
